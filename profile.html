<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SKATER // Y2K SK8 DOCU</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(255,0,0,.14), transparent 30%),
        #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid rgba(255,0,0,.3);
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(14px);
    }

    .nav {
      max-width: 1200px;
      min-height: 76px;
      margin: auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-family: Georgia, serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      text-shadow: 2px 2px 0 #a00000;
    }

    .logo span {
      color: #ff1717;
    }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .nav-links a {
      color: #ccc;
      text-decoration: none;
      padding: 10px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .nav-links a:hover {
      color: #ff1717;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 60px auto 100px;
    }

    .profile-header {
      border: 1px solid rgba(255,0,0,.35);
      background: linear-gradient(
        145deg,
        rgba(255,0,0,.08),
        rgba(255,255,255,.025)
      );
      padding: 35px;
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 50px;
    }

    .avatar {
      width: 145px;
      height: 145px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #ff1717;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(255,0,0,.15);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-letter {
      color: #ff1717;
      font-family: Georgia, serif;
      font-size: 55px;
      font-weight: 900;
    }

    .profile-info {
      flex: 1;
    }

    .profile-label {
      color: #ff1717;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 72px);
      line-height: .9;
      letter-spacing: -4px;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-shadow: 4px 4px 0 rgba(255,0,0,.3);
    }

    .username {
      color: #888;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .bio {
      color: #bbb;
      line-height: 1.6;
      max-width: 650px;
      white-space: pre-wrap;
    }

    .edit-profile {
      display: inline-block;
      margin-top: 20px;
      background: #ff1717;
      color: white;
      text-decoration: none;
      padding: 13px 17px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 50px;
    }

    .stat {
      border: 1px solid #292929;
      background: #090909;
      padding: 24px;
    }

    .stat-number {
      font-family: Georgia, serif;
      font-size: 40px;
      font-weight: 900;
      color: #ff1717;
    }

    .stat-label {
      margin-top: 6px;
      color: #777;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    section {
      margin-bottom: 55px;
    }

    .section-title {
      font-family: Georgia, serif;
      font-size: 38px;
      letter-spacing: -2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .tricks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .trick {
      border: 1px solid #292929;
      background: #090909;
      padding: 23px;
    }

    .trick-category {
      color: #ff1717;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .trick-name {
      font-family: Georgia, serif;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .confidence-label {
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .bar {
      height: 8px;
      background: #222;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #ff1717;
    }

    .notes {
      color: #888;
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.5;
    }

    .clips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .clip {
      border: 1px solid #292929;
      background: #090909;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
    }

    .clip-info {
      padding: 15px;
    }

    .clip-trick {
      font-family: Georgia, serif;
      font-size: 20px;
      margin-bottom: 6px;
    }

    .clip-meta {
      color: #777;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .empty {
      border: 1px dashed #333;
      color: #666;
      padding: 35px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 700px) {

      .nav {
        padding: 0 15px;
      }

      .profile-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 25px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .tricks,
      .clips {
        grid-template-columns: 1fr;
      }

      .avatar {
        width: 115px;
        height: 115px;
      }
    }

  </style>
</head>

<body>

<header>

  <nav class="nav">

    <a href="./index.html" class="logo">
      Y2K<span>SK8</span>DOCU
    </a>

    <div class="nav-links">
      <a href="./explore.html">EXPLORE</a>
      <a href="./dashboard.html">ARCHIVE</a>
      <a href="./account.html">ACCOUNT</a>
    </div>

  </nav>

</header>

<main>

  <div id="profileHeader" class="profile-header">
    Loading profile...
  </div>

  <div id="stats" class="stats"></div>

  <section>

    <h2 class="section-title">
      PUBLIC TRICKS.
    </h2>

    <div id="tricks" class="tricks"></div>

  </section>

  <section>

    <h2 class="section-title">
      PUBLIC CLIPS.
    </h2>

    <div id="clips" class="clips"></div>

  </section>

</main>

<script>

  const client = window.supabaseClient;

  const params =
    new URLSearchParams(window.location.search);

  const username =
    params.get("username");

  const profileHeader =
    document.getElementById("profileHeader");

  const statsBox =
    document.getElementById("stats");

  const tricksBox =
    document.getElementById("tricks");

  const clipsBox =
    document.getElementById("clips");

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(date) {

    return new Date(date).toLocaleDateString(
      undefined,
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );
  }

  async function loadProfile() {

    if (!username) {

      profileHeader.innerHTML =
        "<strong>PROFILE NOT FOUND.</strong>";

      return;
    }

    const {
      data: profile,
      error: profileError
    } = await client
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        bio,
        avatar_url
      `)
      .eq("username", username)
      .single();

    if (profileError || !profile) {

      profileHeader.innerHTML =
        "<strong>SKATER NOT FOUND.</strong>";

      return;
    }

    /*
     * Current logged-in user
     */
    const {
      data: { user }
    } = await client.auth.getUser();

    const isOwner =
      user && user.id === profile.id;

    const displayName =
      profile.display_name ||
      profile.username;

    const initial =
      profile.username
        ? profile.username.charAt(0).toUpperCase()
        : "?";

    const avatar =
      profile.avatar_url
        ? `
          <div class="avatar">
            <img
              src="${escapeHtml(profile.avatar_url)}"
              alt="${escapeHtml(displayName)}"
            >
          </div>
        `
        : `
          <div class="avatar">
            <div class="avatar-letter">
              ${escapeHtml(initial)}
            </div>
          </div>
        `;

    profileHeader.innerHTML = `

      ${avatar}

      <div class="profile-info">

        <div class="profile-label">
          SKATER PROFILE
        </div>

        <h1>
          ${escapeHtml(displayName)}
        </h1>

        <div class="username">
          @${escapeHtml(profile.username)}
        </div>

        ${
          profile.bio
            ? `
              <div class="bio">
                ${escapeHtml(profile.bio)}
              </div>
            `
            : ""
        }

        ${
          isOwner
            ? `
              <a
                href="./account.html"
                class="edit-profile"
              >
                EDIT PROFILE
              </a>
            `
            : ""
        }

      </div>
    `;

    /*
     * Public tricks
     */
    const {
      data: tricks,
      error: tricksError
    } = await client
      .from("tricks")
      .select(`
        id,
        name,
        category,
        confidence,
        notes,
        created_at
      `)
      .eq("user_id", profile.id)
      .eq("visibility", "public")
      .order("created_at", {
        ascending: false
      });

    if (tricksError) {
      console.error(tricksError);
    }

    const publicTricks =
      tricks || [];

    /*
     * Sessions
     */
    let sessions = [];

    if (publicTricks.length) {

      const trickIds =
        publicTricks.map(
          trick => trick.id
        );

      const {
        data: sessionData
      } = await client
        .from("sessions")
        .select(`
          id,
          trick_id,
          confidence,
          created_at
        `)
        .in("trick_id", trickIds)
        .order("created_at", {
          ascending: true
        });

      sessions =
        sessionData || [];
    }

    /*
     * Stats
     */
    const totalSessions =
      sessions.length;

    const averageConfidence =
      publicTricks.length
        ? (
            publicTricks.reduce(
              (sum, trick) =>
                sum + Number(trick.confidence || 0),
              0
            ) / publicTricks.length
          ).toFixed(1)
        : "0.0";

    statsBox.innerHTML = `

      <div class="stat">

        <div class="stat-number">
          ${publicTricks.length}
        </div>

        <div class="stat-label">
          PUBLIC TRICKS
        </div>

      </div>

      <div class="stat">

        <div class="stat-number">
          ${totalSessions}
        </div>

        <div class="stat-label">
          SESSIONS
        </div>

      </div>

      <div class="stat">

        <div class="stat-number">
          ${averageConfidence}
        </div>

        <div class="stat-label">
          AVG CONFIDENCE
        </div>

      </div>
    `;

    /*
     * Trick cards
     */
    if (!publicTricks.length) {

      tricksBox.innerHTML = `
        <div class="empty">
          NO PUBLIC TRICKS YET.
        </div>
      `;

    } else {

      tricksBox.innerHTML =
        publicTricks.map(trick => {

          const confidence =
            Number(trick.confidence || 1);

          return `

            <article class="trick">

              ${
                trick.category
                  ? `
                    <div class="trick-category">
                      ${escapeHtml(trick.category)}
                    </div>
                  `
                  : ""
              }

              <div class="trick-name">
                ${escapeHtml(trick.name)}
              </div>

              <div class="confidence-label">

                <span>
                  CONFIDENCE
                </span>

                <span>
                  ${confidence}/5
                </span>

              </div>

              <div class="bar">
                <div
                  class="bar-fill"
                  style="width:${confidence * 20}%"
                ></div>
              </div>

              ${
                trick.notes
                  ? `
                    <div class="notes">
                      ${escapeHtml(trick.notes)}
                    </div>
                  `
                  : ""
              }

            </article>
          `;

        }).join("");
    }

    /*
     * Public videos
     */
    const sessionIds =
      sessions.map(
        session => session.id
      );

    let videos = [];

    if (sessionIds.length) {

      const {
        data: videoData,
        error: videoError
      } = await client
        .from("videos")
        .select(`
          id,
          session_id,
          storage_path,
          visibility,
          created_at
        `)
        .eq("user_id", profile.id)
        .eq("visibility", "public")
        .in("session_id", sessionIds)
        .order("created_at", {
          ascending: false
        });

      if (videoError) {
        console.error(videoError);
      }

      videos =
        videoData || [];
    }

    /*
     * Clip cards
     */
    if (!videos.length) {

      clipsBox.innerHTML = `
        <div class="empty">
          NO PUBLIC CLIPS YET.
        </div>
      `;

    } else {

      clipsBox.innerHTML =
        videos.map(video => {

          const session =
            sessions.find(
              item =>
                item.id === video.session_id
            );

          const trick =
            session
              ? publicTricks.find(
                  item =>
                    item.id === session.trick_id
                )
              : null;

          const {
            data: publicUrlData
          } =
            client.storage
              .from("public-videos")
              .getPublicUrl(
                video.storage_path
              );

          const publicUrl =
            publicUrlData.publicUrl;

          return `

            <article class="clip">

              <video
                controls
                preload="metadata"
                src="${escapeHtml(publicUrl)}"
              ></video>

              <div class="clip-info">

                <div class="clip-trick">
                  ${escapeHtml(
                    trick?.name || "SKATE CLIP"
                  )}
                </div>

                <div class="clip-meta">

                  CONFIDENCE
                  ${session?.confidence || "—"}/5

                  &nbsp; // &nbsp;

                  ${formatDate(video.created_at)}

                </div>

              </div>

            </article>
          `;

        }).join("");
    }
  }

  loadProfile();

</script>

</body>
</html>
