<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>

<script>

  const client = window.supabaseClient;

  let profile = null;
  let tricks = [];
  let sessions = [];


  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");


  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function getUsername() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return params.get("username");

  }


  async function loadProfile() {

    const username =
      getUsername();


    if (!username) {

      loading.textContent =
        "NO PROFILE FOUND.";

      return;

    }


    /*
      Load public profile
    */

    const {
      data: profileData,
      error: profileError
    } = await client

      .from("profiles")

      .select(`
        id,
        username,
        display_name,
        bio,
        avatar_url
      `)

      .eq(
        "username",
        username
      )

      .single();


    if (profileError) {

      console.error(profileError);

      loading.textContent =
        "PROFILE NOT FOUND.";

      return;

    }


    profile = profileData;


    /*
      Load public tricks
    */

    const {
      data: trickData,
      error: trickError
    } = await client

      .from("tricks")

      .select(`
        id,
        name,
        category,
        confidence,
        notes,
        created_at
      `)

      .eq(
        "user_id",
        profile.id
      )

      .eq(
        "visibility",
        "public"
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (trickError) {

      console.error(trickError);

      tricks = [];

    } else {

      tricks = trickData || [];

    }


    /*
      Load public sessions belonging
      to this skater's public tricks
    */

    if (tricks.length > 0) {

      const trickIds =
        tricks.map(
          trick => trick.id
        );


      const {
        data: sessionData,
        error: sessionError
      } = await client

        .from("sessions")

        .select(`
          id,
          trick_id,
          confidence,
          created_at
        `)

        .in(
          "trick_id",
          trickIds
        )

        .order(
          "created_at",
          {
            ascending: true
          }
        );


      if (sessionError) {

        console.error(sessionError);

        sessions = [];

      } else {

        sessions =
          sessionData || [];

      }

    }


    renderProfile();

  }


  function renderProfile() {

    document.getElementById(
      "username"
    ).textContent =
      "@" + profile.username;


    document.getElementById(
      "displayName"
    ).textContent =
      profile.display_name || "";


    document.getElementById(
      "bio"
    ).textContent =
      profile.bio || "No bio yet.";


    document.getElementById(
      "trickCount"
    ).textContent =
      tricks.length;


    document.getElementById(
      "trickCountLabel"
    ).textContent =
      tricks.length === 1
        ? "1 TRICK"
        : `${tricks.length} TRICKS`;


    document.getElementById(
      "sessionCount"
    ).textContent =
      sessions.length;


    if (sessions.length > 0) {

      const total =
        sessions.reduce(
          (sum, session) =>
            sum + Number(session.confidence),
          0
        );

      const average =
        total / sessions.length;


      document.getElementById(
        "averageConfidence"
      ).textContent =
        average.toFixed(1);

    }


    renderTricks();


    loading.style.display =
      "none";

    content.style.display =
      "block";

  }


  function renderTricks() {

    const container =
      document.getElementById(
        "tricks"
      );


    if (tricks.length === 0) {

      container.innerHTML = `
        <div class="empty">
          THIS SKATER HASN'T
          PUBLISHED ANY TRICKS YET.
        </div>
      `;

      return;

    }


    container.innerHTML =
      tricks.map(trick => {

        const confidence =
          Number(trick.confidence) || 1;


        const trickSessions =
          sessions.filter(
            session =>
              session.trick_id === trick.id
          );


        const sessionTotal =
          trickSessions.length;


        return `

          <article class="trick">

            <div class="trick-category">

              ${escapeHTML(
                trick.category ||
                "SKATE"
              )}

            </div>


            <div class="trick-name">

              ${escapeHTML(
                trick.name
              )}

            </div>


            ${
              trick.notes
                ? `
                  <div class="trick-notes">
                    ${escapeHTML(
                      trick.notes
                    )}
                  </div>
                `
                : ""
            }


            <div class="confidence-row">

              <div class="confidence-label">
                CONFIDENCE
              </div>

              <div class="confidence-bar">

                <div
                  class="confidence-fill"
                  style="width:${confidence * 20}%"
                ></div>

              </div>

              <div class="confidence-number">
                ${confidence}/5
              </div>

            </div>


            <div
              style="
                margin-top:18px;
                color:#555;
                font-size:9px;
                letter-spacing:1px;
              "
            >

              ${sessionTotal}
              ${
                sessionTotal === 1
                  ? "SESSION"
                  : "SESSIONS"
              }

            </div>

          </article>

        `;

      }).join("");

  }


  async function start() {

    if (!client) {

      loading.textContent =
        "SUPABASE IS NOT CONNECTED.";

      return;

    }


    await loadProfile();

  }


  start();

</script>
