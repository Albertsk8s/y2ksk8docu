<body>

<header>

  <!-- EXPLORE IS PUBLIC, SO LOGO GOES TO PUBLIC HOMEPAGE -->
  <a
    href="./index.html"
    class="logo"
    aria-label="Y2KSK8DOCU Homepage"
  >
    Y2KSK8DOCU
  </a>

  <nav>

    <a
      href="./explore.html"
      class="active"
    >
      EXPLORE
    </a>

    <a href="./dashboard.html">
      MY ARCHIVE
    </a>

    <a href="./account.html">
      ACCOUNT
    </a>

  </nav>

</header>


<main>

  <div class="eyebrow">
    PUBLIC ARCHIVE //
  </div>

  <h1>
    EXPLORE.
  </h1>

  <p class="intro">
    Discover tricks documented by skaters.
    Watch the progression. Find inspiration.
    Keep skating.
  </p>


  <!-- SEARCH -->

  <div class="search-area">

    <input
      type="text"
      id="searchInput"
      placeholder="SEARCH TRICKS..."
      autocomplete="off"
    >

    <button id="searchButton">
      SEARCH
    </button>

  </div>


  <!-- RESULTS -->

  <div class="section-header">

    <div class="section-title">
      PUBLIC TRICKS
    </div>

    <div
      class="result-count"
      id="resultCount"
    >
      LOADING...
    </div>

  </div>


  <div id="trickGrid">

    <div class="loading">
      LOADING PUBLIC ARCHIVE...
    </div>

  </div>

</main>


<script>

  const client = window.supabaseClient;

  const trickGrid =
    document.getElementById("trickGrid");

  const resultCount =
    document.getElementById("resultCount");

  const searchInput =
    document.getElementById("searchInput");

  const searchButton =
    document.getElementById("searchButton");


  let allTricks = [];


  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  async function loadPublicTricks() {

    const {
      data,
      error
    } = await client

      .from("tricks")

      .select(`
        id,
        name,
        category,
        confidence,
        notes,
        created_at,
        profiles (
          username,
          display_name
        )
      `)

      .eq("visibility", "public")

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      trickGrid.innerHTML = `
        <div class="empty">
          COULD NOT LOAD PUBLIC TRICKS.
        </div>
      `;

      resultCount.textContent =
        "ERROR";

      return;

    }


    allTricks = data || [];

    renderTricks(allTricks);

  }


  function renderTricks(tricks) {

    resultCount.textContent =
      tricks.length === 1
        ? "1 TRICK"
        : `${tricks.length} TRICKS`;


    if (tricks.length === 0) {

      trickGrid.innerHTML = `
        <div class="empty">
          NO PUBLIC TRICKS FOUND.
        </div>
      `;

      return;

    }


    trickGrid.innerHTML =
      tricks.map(trick => {

        const profile =
          trick.profiles || {};

        const username =
          profile.username ||
          "UNKNOWN SKATER";

        const displayName =
          profile.display_name ||
          username;


        const confidence =
          Number(trick.confidence) || 1;


        return `

          <article class="card">

            <div class="category">

              ${escapeHTML(
                trick.category ||
                "SKATE"
              )}

            </div>


            <div class="trick-name">

              ${escapeHTML(
                trick.name
              )}

            </div>


            <div class="profile-name">

              BY

              <span>
                ${escapeHTML(
                  displayName
                )}
              </span>

            </div>


            <div class="confidence">

              <div class="confidence-label">
                CONFIDENCE
              </div>

              <div class="confidence-bar">

                <div
                  class="confidence-fill"
                  style="width:${confidence * 20}%"
                ></div>

              </div>

              <div class="confidence-number">
                ${confidence}/5
              </div>

            </div>


            <a
              href="./profile.html?username=${encodeURIComponent(username)}"
              class="open-btn"
            >
              VIEW SKATER
            </a>

          </article>

        `;

      }).join("");

  }


  function performSearch() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!search) {

      renderTricks(allTricks);

      return;

    }


    const filtered =
      allTricks.filter(trick => {

        const name =
          (trick.name || "")
            .toLowerCase();

        const category =
          (trick.category || "")
            .toLowerCase();

        const profile =
          trick.profiles || {};

        const username =
          (profile.username || "")
            .toLowerCase();

        const displayName =
          (profile.display_name || "")
            .toLowerCase();


        return (
          name.includes(search) ||
          category.includes(search) ||
          username.includes(search) ||
          displayName.includes(search)
        );

      });


    renderTricks(filtered);

  }


  searchButton.addEventListener(
    "click",
    performSearch
  );


  searchInput.addEventListener(
    "input",
    performSearch
  );


  /*
    EXPLORE IS A PUBLIC PAGE.

    If a user arrives here while signed in,
    end their Supabase session.

    This means Explore is treated as a
    public section of the website.

    The logo then takes them to index.html.
  */

  async function start() {

    if (!client) {

      trickGrid.innerHTML = `
        <div class="empty">
          SUPABASE IS NOT CONNECTED.
        </div>
      `;

      return;

    }


    try {

      const {
        error
      } = await client.auth.signOut();

      if (error) {
        console.error(
          "Explore sign-out error:",
          error
        );
      }

    } catch (error) {

      console.error(
        "Unexpected Explore auth error:",
        error
      );

    }


    await loadPublicTricks();

  }


  start();

</script>

</body>
</html>
