<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Tricks — y2ksk8docu</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=Roboto+Mono:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(180, 0, 0, 0.14), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 0, 0.08), transparent 30%),
        #070707;
      color: #f3f3f3;
      font-family: "Roboto Mono", monospace;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(255,255,255,0.05) 4px
        );
      z-index: 999;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* NAV */

    header {
      width: 100%;
      border-bottom: 1px solid #242424;
      background: rgba(5, 5, 5, 0.94);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav {
      max-width: 1400px;
      margin: auto;
      min-height: 82px;
      padding: 18px 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      font-family: "Permanent Marker", cursive;
      font-size: 27px;
      color: #ff1616;
      text-shadow:
        2px 2px 0 #650000,
        0 0 14px rgba(255, 0, 0, 0.3);
      transform: rotate(-2deg);
      white-space: nowrap;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-wrap: wrap;
    }

    .user-name {
      color: #999;
      font-size: 12px;
    }

    .nav-link {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ddd;
      transition: 0.2s ease;
    }

    .nav-link:hover {
      color: #ff1717;
    }

    .sign-out {
      border: 1px solid #3a3a3a;
      background: #111;
      color: #ddd;
      padding: 9px 14px;
      font-size: 11px;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .sign-out:hover {
      border-color: #ff1b1b;
      color: #ff1b1b;
    }

    /* MAIN */

    main {
      max-width: 1400px;
      margin: auto;
      padding: 65px 28px 100px;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      margin-bottom: 45px;
    }

    .eyebrow {
      color: #ff1818;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(60px, 9vw, 125px);
      line-height: 0.82;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f4f4f4;
      text-shadow: 4px 4px 0 #760000;
    }

    .add-button {
      background: #e50909;
      border: none;
      color: white;
      padding: 16px 25px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 5px 5px 0 #520000;
      transition: 0.2s ease;
    }

    .add-button:hover {
      background: #ff1717;
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 #520000;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 55px;
    }

    .stat {
      background: #101010;
      border: 1px solid #262626;
      padding: 25px;
      position: relative;
      overflow: hidden;
    }

    .stat::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      right: -30px;
      bottom: -30px;
      border: 1px solid #3a0000;
      transform: rotate(45deg);
    }

    .stat-label {
      color: #777;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .stat-value {
      font-family: "Bebas Neue", sans-serif;
      font-size: 45px;
      color: #ff1b1b;
    }

    /* ARCHIVE */

    .archive-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292929;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .archive-heading h2 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 36px;
      letter-spacing: 1px;
    }

    .archive-heading span {
      color: #666;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .trick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .trick-card {
      background: #0f0f0f;
      border: 1px solid #292929;
      padding: 25px;
      position: relative;
      transition: 0.2s ease;
    }

    .trick-card:hover {
      border-color: #7c1010;
      transform: translateY(-3px);
    }

    .trick-category {
      color: #ff1717;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .trick-name {
      font-family: "Bebas Neue", sans-serif;
      font-size: 38px;
      letter-spacing: 1px;
      margin-bottom: 20px;
      line-height: 0.95;
    }

    .confidence-label {
      display: flex;
      justify-content: space-between;
      color: #777;
      font-size: 10px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .confidence-bar {
      height: 7px;
      width: 100%;
      background: #242424;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .confidence-fill {
      height: 100%;
      background: #e50909;
    }

    .trick-notes {
      color: #999;
      font-size: 11px;
      line-height: 1.7;
      min-height: 42px;
      margin-bottom: 22px;
    }

    .visibility {
      display: inline-block;
      padding: 5px 8px;
      font-size: 9px;
      letter-spacing: 1px;
      border: 1px solid #333;
      color: #888;
      margin-bottom: 18px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-button {
      border: 1px solid #333;
      background: #151515;
      color: #ddd;
      padding: 9px 12px;
      font-size: 10px;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .card-button:hover {
      border-color: #ff1717;
      color: #ff1717;
    }

    .card-button.primary {
      background: #b90000;
      border-color: #b90000;
      color: white;
    }

    .card-button.primary:hover {
      background: #e50909;
      border-color: #e50909;
      color: white;
    }

    .empty {
      border: 1px dashed #333;
      padding: 70px 25px;
      text-align: center;
      color: #777;
    }

    .empty h3 {
      font-family: "Bebas Neue", sans-serif;
      color: #ddd;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .empty p {
      font-size: 11px;
      margin-bottom: 25px;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
      backdrop-filter: blur(6px);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #0d0d0d;
      border: 1px solid #3c3c3c;
      box-shadow: 12px 12px 0 #500000;
      padding: 32px;
    }

    .modal h2 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 48px;
      margin-bottom: 5px;
    }

    .modal-subtitle {
      color: #777;
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #999;
      font-size: 10px;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #151515;
      border: 1px solid #333;
      color: white;
      padding: 13px;
      outline: none;
      border-radius: 0;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #d20b0b;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    select {
      appearance: auto;
    }

    .confidence-options {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .confidence-option {
      position: relative;
    }

    .confidence-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .confidence-option label {
      border: 1px solid #333;
      background: #151515;
      padding: 13px 5px;
      text-align: center;
      color: #888;
      cursor: pointer;
      margin: 0;
      font-size: 13px;
    }

    .confidence-option input:checked + label {
      background: #b60000;
      border-color: #ff1717;
      color: white;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 30px;
    }

    .modal-button {
      padding: 12px 18px;
      border: 1px solid #333;
      background: #151515;
      color: #ddd;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .modal-button:hover {
      border-color: #aaa;
    }

    .modal-button.save {
      background: #d30909;
      border-color: #d30909;
      color: white;
    }

    .modal-button.save:hover {
      background: #ff1717;
    }

    .error {
      color: #ff4444;
      font-size: 11px;
      margin-top: 12px;
      display: none;
    }

    /* RESPONSIVE */

    @media (max-width: 950px) {
      .trick-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-right {
        width: 100%;
        justify-content: flex-start;
      }

      main {
        padding: 45px 18px 80px;
      }

      .top-section {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .trick-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 75px;
      }
    }

    @media (max-width: 450px) {
      .nav-right {
        gap: 11px;
      }

      .user-name {
        width: 100%;
      }

      .modal {
        padding: 22px;
      }

      .modal-buttons {
        flex-direction: column;
      }

      .modal-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <header>
    <nav class="nav">

      <a href="./index.html" class="logo">
        y2ksk8docu
      </a>

      <div class="nav-right">

        <span id="userName" class="user-name">
          LOADING...
        </span>

        <a href="./explore.html" class="nav-link">
          EXPLORE
        </a>

        <a href="./account.html" class="nav-link">
          ACCOUNT
        </a>

        <button id="signOutButton" class="sign-out">
          SIGN OUT
        </button>

      </div>

    </nav>
  </header>


  <!-- MAIN -->

  <main>

    <section class="top-section">

      <div>
        <div class="eyebrow">
          YOUR SKATE ARCHIVE
        </div>

        <h1>
          MY<br>
          TRICKS.
        </h1>
      </div>

      <button id="addTrickButton" class="add-button">
        + ADD TRICK
      </button>

    </section>


    <!-- STATS -->

    <section class="stats">

      <div class="stat">
        <div class="stat-label">
          TRICKS LOGGED
        </div>

        <div id="tricksCount" class="stat-value">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          AVERAGE CONFIDENCE
        </div>

        <div id="averageConfidence" class="stat-value">
          0.0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          PUBLIC TRICKS
        </div>

        <div id="publicCount" class="stat-value">
          0
        </div>
      </div>

    </section>


    <!-- TRICK ARCHIVE -->

    <section>

      <div class="archive-heading">

        <h2>
          TRICK ARCHIVE
        </h2>

        <span id="archiveStatus">
          LOADING...
        </span>

      </div>

      <div id="trickGrid" class="trick-grid"></div>

    </section>

  </main>


  <!-- ADD / EDIT MODAL -->

  <div id="modalBackdrop" class="modal-backdrop">

    <div class="modal">

      <h2 id="modalTitle">
        ADD TRICK
      </h2>

      <div class="modal-subtitle">
        LOG IT. REMEMBER IT. GET BETTER.
      </div>


      <form id="trickForm">

        <div class="form-group">

          <label for="trickName">
            Trick Name
          </label>

          <input
            id="trickName"
            type="text"
            placeholder="e.g. Kickflip"
            required
          />

        </div>


        <div class="form-group">

          <label for="trickCategory">
            Category
          </label>

          <input
            id="trickCategory"
            type="text"
            placeholder="e.g. Flip / Street / Grind"
          />

        </div>


        <div class="form-group">

          <label>
            Confidence
          </label>

          <div class="confidence-options">

            <div class="confidence-option">
              <input
                type="radio"
                name="confidence"
                id="confidence1"
                value="1"
              />
              <label for="confidence1">1</label>
            </div>

            <div class="confidence-option">
              <input
                type="radio"
                name="confidence"
                id="confidence2"
                value="2"
              />
              <label for="confidence2">2</label>
            </div>

            <div class="confidence-option">
              <input
                type="radio"
                name="confidence"
                id="confidence3"
                value="3"
              />
              <label for="confidence3">3</label>
            </div>

            <div class="confidence-option">
              <input
                type="radio"
                name="confidence"
                id="confidence4"
                value="4"
              />
              <label for="confidence4">4</label>
            </div>

            <div class="confidence-option">
              <input
                type="radio"
                name="confidence"
                id="confidence5"
                value="5"
              />
              <label for="confidence5">5</label>
            </div>

          </div>

        </div>


        <div class="form-group">

          <label for="trickNotes">
            Notes
          </label>

          <textarea
            id="trickNotes"
            placeholder="How does it feel? What needs work?"
          ></textarea>

        </div>


        <div class="form-group">

          <label for="trickVisibility">
            Visibility
          </label>

          <select id="trickVisibility">

            <option value="private">
              PRIVATE — ONLY YOU
            </option>

            <option value="public">
              PUBLIC — SHOW THE SKATE WORLD
            </option>

          </select>

        </div>


        <div id="formError" class="error"></div>


        <div class="modal-buttons">

          <button
            type="button"
            id="cancelButton"
            class="modal-button"
          >
            CANCEL
          </button>

          <button
            type="submit"
            class="modal-button save"
          >
            SAVE TRICK
          </button>

        </div>

      </form>

    </div>

  </div>


  <script>

    const client = window.supabaseClient;

    let currentUser = null;
    let editingTrickId = null;
    let tricks = [];


    /*
      ----------------------------------------
      AUTH CHECK
      ----------------------------------------
    */

    async function checkAuth() {

      const {
        data: { session },
        error
      } = await client.auth.getSession();

      if (error || !session) {

        window.location.href = "./auth.html";
        return false;

      }

      currentUser = session.user;

      return true;
    }


    /*
      ----------------------------------------
      LOAD PROFILE
      ----------------------------------------
    */

    async function loadProfile() {

      const { data, error } = await client
        .from("profiles")
        .select("username, display_name")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (error) {

        console.error("Profile error:", error);

        document.getElementById("userName").textContent =
          currentUser.email || "SKATER";

        return;
      }

      if (data) {

        document.getElementById("userName").textContent =
          "@" + data.username;

      } else {

        document.getElementById("userName").textContent =
          currentUser.email || "SKATER";

      }
    }


    /*
      ----------------------------------------
      LOAD TRICKS
      ----------------------------------------
    */

    async function loadTricks() {

      document.getElementById("archiveStatus").textContent =
        "LOADING...";

      const { data, error } = await client
        .from("tricks")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {

        console.error("Tricks error:", error);

        document.getElementById("archiveStatus").textContent =
          "ERROR";

        showError(
          "Could not load your tricks. Check the browser console."
        );

        return;
      }

      tricks = data || [];

      renderStats();
      renderTricks();

      document.getElementById("archiveStatus").textContent =
        `${tricks.length} TRICK${tricks.length === 1 ? "" : "S"}`;
    }


    /*
      ----------------------------------------
      STATS
      ----------------------------------------
    */

    function renderStats() {

      const total = tricks.length;

      const publicTotal = tricks.filter(
        trick => trick.visibility === "public"
      ).length;

      const average =
        total === 0
          ? 0
          : tricks.reduce(
              (sum, trick) => sum + Number(trick.confidence || 0),
              0
            ) / total;

      document.getElementById("tricksCount").textContent =
        total;

      document.getElementById("publicCount").textContent =
        publicTotal;

      document.getElementById("averageConfidence").textContent =
        average.toFixed(1);
    }


    /*
      ----------------------------------------
      ESCAPE HTML
      ----------------------------------------
    */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /*
      ----------------------------------------
      RENDER TRICKS
      ----------------------------------------
    */

    function renderTricks() {

      const grid = document.getElementById("trickGrid");

      if (!tricks.length) {

        grid.innerHTML = `
          <div class="empty" style="grid-column: 1 / -1;">

            <h3>NO TRICKS YET.</h3>

            <p>
              Start building your skate archive.
            </p>

            <button
              class="add-button"
              onclick="openAddModal()"
            >
              + ADD YOUR FIRST TRICK
            </button>

          </div>
        `;

        return;
      }


      grid.innerHTML = tricks.map(trick => {

        const confidence =
          Number(trick.confidence || 1);

        const percentage =
          (confidence / 5) * 100;

        const visibility =
          trick.visibility === "public"
            ? "PUBLIC"
            : "PRIVATE";

        return `

          <article class="trick-card">

            <div class="trick-category">
              ${escapeHtml(trick.category || "UNCATEGORIZED")}
            </div>

            <div class="trick-name">
              ${escapeHtml(trick.name)}
            </div>

            <div class="confidence-label">
              <span>CONFIDENCE</span>
              <span>${confidence}/5</span>
            </div>

            <div class="confidence-bar">
              <div
                class="confidence-fill"
                style="width:${percentage}%"
              ></div>
            </div>

            <div class="trick-notes">
              ${
                escapeHtml(
                  trick.notes || "No notes yet."
                )
              }
            </div>

            <div class="visibility">
              ${visibility}
            </div>

            <div class="card-actions">

              <a
                class="card-button primary"
                href="./trick.html?id=${encodeURIComponent(trick.id)}"
              >
                OPEN / CLIPS
              </a>

              <button
                class="card-button"
                onclick="openEditModal('${trick.id}')"
              >
                EDIT
              </button>

              <button
                class="card-button"
                onclick="deleteTrick('${trick.id}')"
              >
                DELETE
              </button>

            </div>

          </article>

        `;

      }).join("");
    }


    /*
      ----------------------------------------
      MODAL
      ----------------------------------------
    */

    function openAddModal() {

      editingTrickId = null;

      document.getElementById("modalTitle").textContent =
        "ADD TRICK";

      document.getElementById("trickForm").reset();

      document.getElementById("confidence1").checked = true;

      document.getElementById("trickVisibility").value =
        "private";

      document.getElementById("formError").style.display =
        "none";

      document.getElementById("modalBackdrop")
        .classList.add("show");
    }


    function openEditModal(id) {

      const trick = tricks.find(
        item => item.id === id
      );

      if (!trick) {
        return;
      }

      editingTrickId = id;

      document.getElementById("modalTitle").textContent =
        "EDIT TRICK";

      document.getElementById("trickName").value =
        trick.name || "";

      document.getElementById("trickCategory").value =
        trick.category || "";

      document.getElementById("trickNotes").value =
        trick.notes || "";

      document.getElementById("trickVisibility").value =
        trick.visibility || "private";


      const confidenceInput =
        document.querySelector(
          `input[name="confidence"][value="${trick.confidence}"]`
        );

      if (confidenceInput) {
        confidenceInput.checked = true;
      }

      document.getElementById("formError").style.display =
        "none";

      document.getElementById("modalBackdrop")
        .classList.add("show");
    }


    function closeModal() {

      document.getElementById("modalBackdrop")
        .classList.remove("show");

      editingTrickId = null;
    }


    /*
      ----------------------------------------
      FORM SUBMIT
      ----------------------------------------
    */

    document.getElementById("trickForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
          document.getElementById("trickName")
            .value
            .trim();

        const category =
          document.getElementById("trickCategory")
            .value
            .trim();

        const notes =
          document.getElementById("trickNotes")
            .value
            .trim();

        const visibility =
          document.getElementById("trickVisibility")
            .value;

        const confidenceInput =
          document.querySelector(
            'input[name="confidence"]:checked'
          );

        const confidence =
          confidenceInput
            ? Number(confidenceInput.value)
            : 1;


        if (!name) {

          showFormError(
            "Give the trick a name."
          );

          return;
        }


        const saveButton =
          document.querySelector(
            '#trickForm button[type="submit"]'
          );

        saveButton.disabled = true;
        saveButton.textContent = "SAVING...";


        try {

          if (editingTrickId) {

            /*
              UPDATE EXISTING TRICK
            */

            const { error } = await client
              .from("tricks")
              .update({
                name,
                category: category || null,
                confidence,
                notes: notes || null,
                visibility,
                updated_at: new Date().toISOString()
              })
              .eq("id", editingTrickId)
              .eq("user_id", currentUser.id);

            if (error) {
              throw error;
            }

          } else {

            /*
              CREATE NEW TRICK
            */

            const { data: newTrick, error } =
              await client
                .from("tricks")
                .insert({
                  user_id: currentUser.id,
                  name,
                  category: category || null,
                  confidence,
                  notes: notes || null,
                  visibility
                })
                .select()
                .single();

            if (error) {
              throw error;
            }


            /*
              CREATE FIRST SESSION
              SO PROGRESSION STARTS AT THIS CONFIDENCE.
            */

            const { error: sessionError } =
              await client
                .from("sessions")
                .insert({
                  trick_id: newTrick.id,
                  user_id: currentUser.id,
                  confidence,
                  notes: notes || null
                });

            if (sessionError) {

              console.error(
                "Initial session error:",
                sessionError
              );

            }

          }


          closeModal();

          await loadTricks();

        } catch (error) {

          console.error(
            "Save trick error:",
            error
          );

          showFormError(
            error.message ||
            "Something went wrong while saving."
          );

        } finally {

          saveButton.disabled = false;
          saveButton.textContent = "SAVE TRICK";

        }

      });


    /*
      ----------------------------------------
      DELETE TRICK
      ----------------------------------------
    */

    async function deleteTrick(id) {

      const trick = tricks.find(
        item => item.id === id
      );

      if (!trick) {
        return;
      }


      const confirmed =
        confirm(
          `Delete "${trick.name}"?\n\nThis will remove the trick and its progression history.`
        );

      if (!confirmed) {
        return;
      }


      const { error } = await client
        .from("tricks")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);


      if (error) {

        console.error(
          "Delete error:",
          error
        );

        alert(
          "Could not delete this trick."
        );

        return;
      }


      await loadTricks();
    }


    /*
      ----------------------------------------
      ERROR HELPERS
      ----------------------------------------
    */

    function showFormError(message) {

      const error =
        document.getElementById("formError");

      error.textContent = message;
      error.style.display = "block";
    }


    function showError(message) {

      console.error(message);
    }


    /*
      ----------------------------------------
      BUTTON EVENTS
      ----------------------------------------
    */

    document.getElementById("addTrickButton")
      .addEventListener(
        "click",
        openAddModal
      );


    document.getElementById("cancelButton")
      .addEventListener(
        "click",
        closeModal
      );


    document.getElementById("modalBackdrop")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target ===
            document.getElementById("modalBackdrop")
          ) {

            closeModal();

          }

        }
      );


    /*
      ----------------------------------------
      SIGN OUT
      ----------------------------------------
    */

    document.getElementById("signOutButton")
      .addEventListener(
        "click",
        async function() {

          const { error } =
            await client.auth.signOut();

          if (error) {

            console.error(
              "Sign out error:",
              error
            );

            return;
          }

          window.location.href =
            "./auth.html";

        }
      );


    /*
      ----------------------------------------
      START DASHBOARD
      ----------------------------------------
    */

    async function startDashboard() {

      const authenticated =
        await checkAuth();

      if (!authenticated) {
        return;
      }

      await loadProfile();

      await loadTricks();

    }


    startDashboard();

  </script>

</body>
</html>
