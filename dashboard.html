<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>y2ksk8docu — My Tricks</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090909;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.012) 0px,
          rgba(255,255,255,0.012) 1px,
          transparent 1px,
          transparent 4px
        );
      z-index: 20;
    }

    header {
      height: 78px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: #090909;
    }

    .logo {
      color: #e00000;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .user-name {
      color: #aaa;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logout {
      border: 1px solid #333;
      background: transparent;
      color: #999;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logout:hover {
      border-color: #e00000;
      color: #e00000;
    }

    main {
      width: min(1200px, 90%);
      margin: 0 auto;
      padding: 70px 0;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      margin-bottom: 45px;
    }

    .eyebrow {
      color: #e00000;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 8vw, 90px);
      line-height: .85;
      letter-spacing: -5px;
      text-transform: uppercase;
    }

    .add-btn {
      border: none;
      background: #e00000;
      color: white;
      padding: 16px 22px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .add-btn:hover {
      background: #ff1616;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #292929;
      border: 1px solid #292929;
      margin-bottom: 50px;
    }

    .stat {
      background: #0f0f0f;
      padding: 25px;
    }

    .stat-label {
      color: #666;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
    }

    .archive-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292929;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .archive-title h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      text-transform: uppercase;
    }

    .archive-title span {
      color: #555;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .tricks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .trick-card {
      background: #0f0f0f;
      border: 1px solid #292929;
      padding: 25px;
      position: relative;
      transition: .2s ease;
    }

    .trick-card:hover {
      border-color: #444;
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .category {
      color: #e00000;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .visibility {
      color: #666;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .trick-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      text-transform: uppercase;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .notes {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
      min-height: 42px;
      margin-bottom: 22px;
    }

    .confidence-label {
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .confidence-bar {
      height: 7px;
      background: #222;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .confidence-fill {
      height: 100%;
      background: #e00000;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 8px;
    }

    .card-btn {
      padding: 11px 6px;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .card-btn:hover {
      border-color: #e00000;
      color: #e00000;
    }

    .open-btn {
      border-color: #e00000;
      color: #e00000;
    }

    .open-btn:hover {
      background: #e00000;
      color: white;
    }

    .delete-btn:hover {
      border-color: #8b0000;
      color: #ff4444;
    }

    .empty {
      border: 1px dashed #333;
      padding: 70px 30px;
      text-align: center;
    }

    .empty h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 35px;
      margin-bottom: 10px;
    }

    .empty p {
      color: #666;
      font-size: 13px;
      margin-bottom: 25px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #101010;
      border: 1px solid #333;
      padding: 32px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .modal-head h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      text-transform: uppercase;
    }

    .close {
      border: 0;
      background: transparent;
      color: #777;
      font-size: 25px;
      cursor: pointer;
    }

    .close:hover {
      color: #e00000;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #999;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #303030;
      background: #080808;
      color: white;
      padding: 14px;
      outline: none;
      font: inherit;
      font-size: 13px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #e00000;
    }

    .confidence-options {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .confidence-option input {
      display: none;
    }

    .confidence-option span {
      display: block;
      text-align: center;
      border: 1px solid #303030;
      padding: 12px 5px;
      color: #777;
      cursor: pointer;
      font-weight: 900;
    }

    .confidence-option input:checked + span {
      background: #e00000;
      border-color: #e00000;
      color: white;
    }

    .visibility-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .visibility-option input {
      display: none;
    }

    .visibility-option span {
      display: block;
      border: 1px solid #303030;
      padding: 14px;
      text-align: center;
      color: #777;
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .visibility-option input:checked + span {
      border-color: #e00000;
      color: #e00000;
    }

    .save-btn {
      width: 100%;
      border: none;
      background: #e00000;
      color: white;
      padding: 16px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .save-btn:hover {
      background: #ff1616;
    }

    .save-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .modal-message {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #5b2222;
      color: #ff8a8a;
      font-size: 12px;
    }

    @media (max-width: 750px) {
      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .tricks {
        grid-template-columns: 1fr;
      }

      .header-right .user-name {
        display: none;
      }

      main {
        padding: 45px 0;
      }

      .card-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">y2ksk8docu</a>

  <div class="header-right">
    <span class="user-name" id="userName">LOADING...</span>

    <button class="logout" id="logoutBtn">
      SIGN OUT
    </button>
  </div>
</header>

<main>

  <section class="top">

    <div>
      <div class="eyebrow">PERSONAL SKATE ARCHIVE</div>
      <h1>MY TRICKS.</h1>
    </div>

    <button class="add-btn" id="openAddBtn">
      + ADD TRICK
    </button>

  </section>

  <section class="stats">

    <div class="stat">
      <div class="stat-label">Tricks Logged</div>
      <div class="stat-value" id="trickCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Average Confidence</div>
      <div class="stat-value" id="averageConfidence">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Public Tricks</div>
      <div class="stat-value" id="publicCount">0</div>
    </div>

  </section>

  <section>

    <div class="archive-title">
      <h2>Archive</h2>
      <span id="archiveStatus">LOADING...</span>
    </div>

    <div id="trickContainer"></div>

  </section>

</main>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="trickModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">Add Trick</h2>

      <button class="close" id="closeModal">
        ×
      </button>

    </div>

    <div class="modal-message" id="modalMessage"></div>

    <form id="trickForm">

      <div class="field">

        <label for="trickName">
          Trick Name
        </label>

        <input
          type="text"
          id="trickName"
          placeholder="Kickflip"
          required
        >

      </div>


      <div class="field">

        <label for="category">
          Category
        </label>

        <select id="category">

          <option value="Flatground">Flatground</option>
          <option value="Grinds">Grinds</option>
          <option value="Slides">Slides</option>
          <option value="Manuals">Manuals</option>
          <option value="Transition">Transition</option>
          <option value="Freestyle">Freestyle</option>
          <option value="Other">Other</option>

        </select>

      </div>


      <div class="field">

        <label>
          Confidence
        </label>

        <div class="confidence-options">

          <label class="confidence-option">
            <input
              type="radio"
              name="confidence"
              value="1"
            >
            <span>1</span>
          </label>

          <label class="confidence-option">
            <input
              type="radio"
              name="confidence"
              value="2"
            >
            <span>2</span>
          </label>

          <label class="confidence-option">
            <input
              type="radio"
              name="confidence"
              value="3"
              checked
            >
            <span>3</span>
          </label>

          <label class="confidence-option">
            <input
              type="radio"
              name="confidence"
              value="4"
            >
            <span>4</span>
          </label>

          <label class="confidence-option">
            <input
              type="radio"
              name="confidence"
              value="5"
            >
            <span>5</span>
          </label>

        </div>

      </div>


      <div class="field">

        <label for="notes">
          Notes
        </label>

        <textarea
          id="notes"
          placeholder="What are you working on?"
        ></textarea>

      </div>


      <div class="field">

        <label>
          Visibility
        </label>

        <div class="visibility-options">

          <label class="visibility-option">

            <input
              type="radio"
              name="visibility"
              value="private"
              checked
            >

            <span>PRIVATE</span>

          </label>

          <label class="visibility-option">

            <input
              type="radio"
              name="visibility"
              value="public"
            >

            <span>PUBLIC</span>

          </label>

        </div>

      </div>


      <button
        class="save-btn"
        id="saveBtn"
        type="submit"
      >
        SAVE TRICK →
      </button>

    </form>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>

<script>

  // ============================================
  // STATE
  // ============================================

  let currentUser = null;

  let editingTrickId = null;


  // ============================================
  // ELEMENTS
  // ============================================

  const trickContainer =
    document.getElementById("trickContainer");

  const trickModal =
    document.getElementById("trickModal");

  const trickForm =
    document.getElementById("trickForm");

  const modalTitle =
    document.getElementById("modalTitle");

  const modalMessage =
    document.getElementById("modalMessage");

  const saveBtn =
    document.getElementById("saveBtn");


  // ============================================
  // START
  // ============================================

  window.addEventListener("load", async function () {

    if (!window.supabaseClient) {

      showModalMessage(
        "Supabase connection is missing. Check supabase.js."
      );

      return;
    }

    await checkUser();

  });


  // ============================================
  // CHECK USER
  // ============================================

  async function checkUser() {

    const {
      data,
      error
    } = await window.supabaseClient.auth.getSession();

    if (error) {

      console.error(error);

      return;
    }

    if (!data.session) {

      window.location.href = "auth.html";

      return;
    }

    currentUser = data.session.user;

    document.getElementById("userName").textContent =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "SKATER";

    await loadTricks();

  }


  // ============================================
  // LOAD TRICKS
  // ============================================

  async function loadTricks() {

    trickContainer.innerHTML =
      '<div class="empty"><p>LOADING ARCHIVE...</p></div>';

    const {
      data,
      error
    } = await window.supabaseClient
      .from("tricks")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      trickContainer.innerHTML =
        '<div class="empty">' +
        '<h3>DATABASE ERROR.</h3>' +
        '<p>' +
        escapeHtml(error.message) +
        '</p>' +
        '</div>';

      return;
    }


    updateStats(data || []);

    renderTricks(data || []);

  }


  // ============================================
  // STATS
  // ============================================

  function updateStats(tricks) {

    document.getElementById("trickCount").textContent =
      tricks.length;


    const publicTricks =
      tricks.filter(
        trick => trick.visibility === "public"
      ).length;


    document.getElementById("publicCount").textContent =
      publicTricks;


    if (tricks.length === 0) {

      document.getElementById("averageConfidence").textContent =
        "—";

      return;
    }


    const total =
      tricks.reduce(
        (sum, trick) =>
          sum + Number(trick.confidence),
        0
      );


    document.getElementById("averageConfidence").textContent =
      (total / tricks.length).toFixed(1);

  }


  // ============================================
  // RENDER TRICKS
  // ============================================

  function renderTricks(tricks) {

    document.getElementById("archiveStatus").textContent =
      tricks.length +
      (tricks.length === 1 ? " TRICK" : " TRICKS");


    if (tricks.length === 0) {

      trickContainer.innerHTML = `
        <div class="empty">

          <h3>NOTHING HERE YET.</h3>

          <p>
            Start documenting your progression.
          </p>

          <button
            class="add-btn"
            onclick="openAddModal()"
          >
            + ADD YOUR FIRST TRICK
          </button>

        </div>
      `;

      return;
    }


    trickContainer.className = "tricks";


    trickContainer.innerHTML =
      tricks.map(trick => {

        const confidence =
          Number(trick.confidence);

        const width =
          confidence * 20;


        return `

          <article class="trick-card">

            <div class="card-top">

              <span class="category">
                ${escapeHtml(
                  trick.category || "OTHER"
                )}
              </span>

              <span class="visibility">
                ${
                  trick.visibility === "public"
                    ? "PUBLIC"
                    : "PRIVATE"
                }
              </span>

            </div>


            <h3 class="trick-name">
              ${escapeHtml(trick.name)}
            </h3>


            <p class="notes">
              ${escapeHtml(
                trick.notes || "No notes yet."
              )}
            </p>


            <div class="confidence-label">

              <span>
                CONFIDENCE
              </span>

              <span>
                ${confidence}/5
              </span>

            </div>


            <div class="confidence-bar">

              <div
                class="confidence-fill"
                style="width:${width}%"
              ></div>

            </div>


            <div class="card-actions">

              <button
                class="card-btn open-btn"
                onclick="openTrick('${trick.id}')"
              >
                OPEN / CLIPS
              </button>

              <button
                class="card-btn"
                onclick="editTrick('${trick.id}')"
              >
                EDIT
              </button>

              <button
                class="card-btn delete-btn"
                onclick="deleteTrick('${trick.id}')"
              >
                DELETE
              </button>

            </div>

          </article>

        `;

      }).join("");

  }


  // ============================================
  // OPEN TRICK / CLIPS
  // ============================================

  function openTrick(id) {

    window.location.href =
      "trick.html?id=" +
      encodeURIComponent(id);

  }


  // ============================================
  // OPEN ADD MODAL
  // ============================================

  document
    .getElementById("openAddBtn")
    .addEventListener(
      "click",
      openAddModal
    );


  function openAddModal() {

    editingTrickId = null;

    modalTitle.textContent =
      "ADD TRICK";

    saveBtn.textContent =
      "SAVE TRICK →";

    trickForm.reset();


    document.querySelector(
      'input[name="confidence"][value="3"]'
    ).checked = true;


    document.querySelector(
      'input[name="visibility"][value="private"]'
    ).checked = true;


    modalMessage.style.display =
      "none";


    trickModal.classList.add("show");

  }


  // ============================================
  // CLOSE MODAL
  // ============================================

  document
    .getElementById("closeModal")
    .addEventListener(
      "click",
      closeModal
    );


  function closeModal() {

    trickModal.classList.remove("show");

  }


  trickModal.addEventListener(
    "click",
    function (event) {

      if (event.target === trickModal) {

        closeModal();

      }

    }
  );


  // ============================================
  // SAVE TRICK
  // ============================================

  trickForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      if (!currentUser) {

        showModalMessage(
          "You are not signed in."
        );

        return;
      }


      const name =
        document
          .getElementById("trickName")
          .value
          .trim();


      const category =
        document
          .getElementById("category")
          .value;


      const notes =
        document
          .getElementById("notes")
          .value
          .trim();


      const confidence =
        Number(
          document.querySelector(
            'input[name="confidence"]:checked'
          ).value
        );


      const visibility =
        document.querySelector(
          'input[name="visibility"]:checked'
        ).value;


      if (!name) {

        showModalMessage(
          "Enter a trick name."
        );

        return;
      }


      saveBtn.disabled = true;

      saveBtn.textContent =
        editingTrickId
          ? "UPDATING..."
          : "SAVING...";


      try {

        // ======================================
        // EDIT
        // ======================================

        if (editingTrickId) {

          const {
            error
          } = await window.supabaseClient
            .from("tricks")
            .update({

              name,
              category,
              confidence,
              notes,
              visibility,
              updated_at:
                new Date().toISOString()

            })
            .eq("id", editingTrickId)
            .eq("user_id", currentUser.id);


          if (error) {
            throw error;
          }

        }


        // ======================================
        // CREATE
        // ======================================

        else {

          const {
            data: trick,
            error
          } = await window.supabaseClient
            .from("tricks")
            .insert({

              user_id:
                currentUser.id,

              name,

              category,

              confidence,

              notes,

              visibility

            })
            .select()
            .single();


          if (error) {
            throw error;
          }


          // ------------------------------------
          // CREATE FIRST SESSION
          // ------------------------------------

          const {
            error: sessionError
          } = await window.supabaseClient
            .from("sessions")
            .insert({

              trick_id:
                trick.id,

              user_id:
                currentUser.id,

              confidence,

              notes

            });


          if (sessionError) {

            console.error(
              "SESSION ERROR:",
              sessionError
            );

          }

        }


        closeModal();

        await loadTricks();


      } catch (error) {

        console.error(error);

        showModalMessage(
          error.message ||
          "Could not save trick."
        );


      } finally {

        saveBtn.disabled = false;

        saveBtn.textContent =
          editingTrickId
            ? "UPDATE TRICK →"
            : "SAVE TRICK →";

      }

    }
  );


  // ============================================
  // EDIT TRICK
  // ============================================

  async function editTrick(id) {

    const {
      data,
      error
    } = await window.supabaseClient
      .from("tricks")
      .select("*")
      .eq("id", id)
      .eq("user_id", currentUser.id)
      .single();


    if (error) {

      alert(error.message);

      return;
    }


    editingTrickId = id;

    modalTitle.textContent =
      "EDIT TRICK";

    saveBtn.textContent =
      "UPDATE TRICK →";


    document.getElementById("trickName").value =
      data.name || "";


    document.getElementById("category").value =
      data.category || "Other";


    document.getElementById("notes").value =
      data.notes || "";


    document.querySelector(
      `input[name="confidence"][value="${data.confidence}"]`
    ).checked = true;


    document.querySelector(
      `input[name="visibility"][value="${data.visibility}"]`
    ).checked = true;


    modalMessage.style.display =
      "none";


    trickModal.classList.add("show");

  }


  // ============================================
  // DELETE TRICK
  // ============================================

  async function deleteTrick(id) {

    const confirmed =
      confirm(
        "Delete this trick? This will also delete its sessions and videos."
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await window.supabaseClient
      .from("tricks")
      .delete()
      .eq("id", id)
      .eq("user_id", currentUser.id);


    if (error) {

      alert(error.message);

      return;
    }


    await loadTricks();

  }


  // ============================================
  // SIGN OUT
  // ============================================

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async function () {

        await window.supabaseClient
          .auth
          .signOut();

        window.location.href =
          "auth.html";

      }
    );


  // ============================================
  // MODAL ERROR
  // ============================================

  function showModalMessage(text) {

    modalMessage.textContent =
      text;

    modalMessage.style.display =
      "block";

  }


  // ============================================
  // HTML ESCAPING
  // ============================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
