<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARCHIVE // Y2K SK8 DOCU</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(255,0,0,.13), transparent 30%),
        radial-gradient(circle at bottom left, rgba(255,0,0,.08), transparent 30%),
        #050505;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .06;
      background-image:
        linear-gradient(rgba(255,255,255,.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.15) 1px, transparent 1px);
      background-size: 4px 4px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(5,5,5,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,0,0,.3);
    }

    .nav {
      max-width: 1200px;
      min-height: 76px;
      margin: auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      text-shadow: 2px 2px 0 #9b0000;
      white-space: nowrap;
    }

    .logo span {
      color: #ff1717;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-right a,
    .nav-right button {
      border: 1px solid transparent;
      background: transparent;
      color: #ccc;
      text-decoration: none;
      padding: 10px 12px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
    }

    .nav-right a:hover,
    .nav-right button:hover {
      color: #ff1717;
      border-color: rgba(255,0,0,.3);
    }

    .user-name {
      color: #ff1717;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-right: 5px;
    }

    main {
      width: min(1150px, calc(100% - 32px));
      margin: 55px auto 100px;
    }

    .top {
      margin-bottom: 35px;
    }

    .eyebrow {
      color: #ff1717;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 9vw, 90px);
      line-height: .85;
      letter-spacing: -5px;
      text-transform: uppercase;
      text-shadow: 5px 5px 0 rgba(255,0,0,.3);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
    }

    .add-button {
      border: none;
      background: #ff1717;
      color: white;
      padding: 15px 20px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-button:hover {
      background: #d60000;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 45px;
    }

    .stat {
      border: 1px solid #292929;
      background: #090909;
      padding: 23px;
    }

    .stat-number {
      color: #ff1717;
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: 900;
    }

    .stat-label {
      margin-top: 5px;
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .section-title {
      font-family: Georgia, serif;
      font-size: 34px;
      letter-spacing: -2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .tricks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .trick-card {
      position: relative;
      border: 1px solid #292929;
      background:
        linear-gradient(145deg, rgba(255,0,0,.045), transparent),
        #090909;
      padding: 24px;
      transition: border-color .2s, transform .2s;
    }

    .trick-card:hover {
      border-color: rgba(255,0,0,.5);
      transform: translateY(-2px);
    }

    .trick-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 15px;
    }

    .category {
      color: #ff1717;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .trick-name {
      font-family: Georgia, serif;
      font-size: 28px;
      line-height: 1;
      text-transform: uppercase;
    }

    .visibility {
      padding: 6px 8px;
      border: 1px solid #333;
      color: #888;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .visibility.public {
      color: #ff1717;
      border-color: rgba(255,0,0,.35);
    }

    .confidence {
      margin-top: 22px;
    }

    .confidence-row {
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .bar {
      height: 8px;
      background: #222;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #ff1717;
    }

    .notes {
      margin-top: 16px;
      color: #888;
      font-size: 12px;
      line-height: 1.55;
    }

    .date {
      margin-top: 16px;
      color: #555;
      font-size: 9px;
      letter-spacing: 1px;
      font-weight: 900;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #1d1d1d;
    }

    .card-actions button,
    .clips-button {
      border: 1px solid #333;
      background: transparent;
      color: #aaa;
      padding: 9px 11px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .card-actions button:hover,
    .clips-button:hover {
      color: white;
      border-color: #ff1717;
    }

    .delete-button:hover {
      color: #ff1717 !important;
      border-color: #ff1717 !important;
    }

    .empty {
      grid-column: 1 / -1;
      border: 1px dashed #333;
      padding: 60px 20px;
      text-align: center;
      color: #666;
    }

    .empty strong {
      display: block;
      color: #ff1717;
      font-family: Georgia, serif;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .empty p {
      font-size: 12px;
      line-height: 1.6;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.8);
      backdrop-filter: blur(8px);
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255,0,0,.4);
      background: #090909;
      padding: 30px;
      box-shadow: 0 30px 100px rgba(0,0,0,.7);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      margin-bottom: 25px;
    }

    .modal-head h2 {
      font-family: Georgia, serif;
      font-size: 35px;
      text-transform: uppercase;
      letter-spacing: -2px;
    }

    .close {
      border: none;
      background: transparent;
      color: #777;
      font-size: 25px;
      cursor: pointer;
    }

    .close:hover {
      color: #ff1717;
    }

    .form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      color: #ff1717;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #333;
      background: #050505;
      color: white;
      padding: 14px;
      outline: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff1717;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    select {
      cursor: pointer;
    }

    .confidence-picker {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .confidence-option {
      position: relative;
    }

    .confidence-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .confidence-option label {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 48px;
      border: 1px solid #333;
      color: #777;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .confidence-option input:checked + label {
      background: #ff1717;
      color: white;
      border-color: #ff1717;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .cancel-button,
    .save-button {
      padding: 13px 18px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
    }

    .cancel-button {
      border: 1px solid #333;
      background: transparent;
      color: #aaa;
    }

    .save-button {
      border: none;
      background: #ff1717;
      color: white;
    }

    .save-button:hover {
      background: #d60000;
    }

    .status {
      display: none;
      padding: 12px;
      font-size: 11px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #ff7777;
      border: 1px solid rgba(255,0,0,.3);
      background: rgba(255,0,0,.05);
    }

    @media (max-width: 750px) {

      .nav {
        padding: 0 14px;
      }

      .user-name {
        display: none;
      }

      .nav-right a,
      .nav-right button {
        padding: 7px;
        font-size: 9px;
      }

      main {
        margin-top: 35px;
      }

      .top-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .add-button {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .tricks {
        grid-template-columns: 1fr;
      }

      .modal-box {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>

  <nav class="nav">

    <a href="./index.html" class="logo">
      Y2K<span>SK8</span>DOCU
    </a>

    <div class="nav-right">

      <span id="userName" class="user-name"></span>

      <a href="./explore.html">
        EXPLORE
      </a>

      <a href="./account.html">
        ACCOUNT
      </a>

      <button id="signOutButton">
        SIGN OUT
      </button>

    </div>

  </nav>

</header>

<main>

  <div class="top">

    <div class="eyebrow">
      PERSONAL SKATE ARCHIVE
    </div>

    <div class="top-row">

      <h1>
        MY<br>TRICKS.
      </h1>

      <button
        id="addTrickButton"
        class="add-button"
      >
        + LOG NEW TRICK
      </button>

    </div>

  </div>

  <div class="stats">

    <div class="stat">

      <div
        id="trickCount"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        TRICKS LOGGED
      </div>

    </div>

    <div class="stat">

      <div
        id="averageConfidence"
        class="stat-number"
      >
        0.0
      </div>

      <div class="stat-label">
        AVG CONFIDENCE
      </div>

    </div>

    <div class="stat">

      <div
        id="publicCount"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        PUBLIC TRICKS
      </div>

    </div>

  </div>

  <section>

    <h2 class="section-title">
      TRICK ARCHIVE.
    </h2>

    <div
      id="tricks"
      class="tricks"
    ></div>

  </section>

</main>

<!-- MODAL -->

<div
  id="trickModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        LOG TRICK.
      </h2>

      <button
        id="closeModal"
        class="close"
        type="button"
      >
        ×
      </button>

    </div>

    <form
      id="trickForm"
      class="form"
    >

      <div class="field">

        <label for="trickName">
          Trick Name
        </label>

        <input
          id="trickName"
          type="text"
          maxlength="80"
          required
          placeholder="Kickflip"
        >

      </div>

      <div class="field">

        <label for="category">
          Category
        </label>

        <select id="category">

          <option value="">
            Select category
          </option>

          <option value="Flatground">
            Flatground
          </option>

          <option value="Flip Trick">
            Flip Trick
          </option>

          <option value="Grind">
            Grind
          </option>

          <option value="Slide">
            Slide
          </option>

          <option value="Manual">
            Manual
          </option>

          <option value="Stairs">
            Stairs
          </option>

          <option value="Transition">
            Transition
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>

      <div class="field">

        <label>
          Confidence
        </label>

        <div class="confidence-picker">

          <div class="confidence-option">
            <input
              type="radio"
              name="confidence"
              id="confidence1"
              value="1"
            >
            <label for="confidence1">1</label>
          </div>

          <div class="confidence-option">
            <input
              type="radio"
              name="confidence"
              id="confidence2"
              value="2"
            >
            <label for="confidence2">2</label>
          </div>

          <div class="confidence-option">
            <input
              type="radio"
              name="confidence"
              id="confidence3"
              value="3"
            >
            <label for="confidence3">3</label>
          </div>

          <div class="confidence-option">
            <input
              type="radio"
              name="confidence"
              id="confidence4"
              value="4"
            >
            <label for="confidence4">4</label>
          </div>

          <div class="confidence-option">
            <input
              type="radio"
              name="confidence"
              id="confidence5"
              value="5"
            >
            <label for="confidence5">5</label>
          </div>

        </div>

      </div>

      <div class="field">

        <label for="notes">
          Notes
        </label>

        <textarea
          id="notes"
          maxlength="1000"
          placeholder="What are you working on?"
        ></textarea>

      </div>

      <div class="field">

        <label for="visibility">
          Visibility
        </label>

        <select id="visibility">

          <option value="private">
            Private
          </option>

          <option value="public">
            Public
          </option>

        </select>

      </div>

      <div
        id="formStatus"
        class="status"
      ></div>

      <div class="modal-actions">

        <button
          type="button"
          id="cancelButton"
          class="cancel-button"
        >
          CANCEL
        </button>

        <button
          type="submit"
          class="save-button"
        >
          SAVE TRICK
        </button>

      </div>

    </form>

  </div>

</div>

<script>

  const client = window.supabaseClient;

  let currentUser = null;
  let tricks = [];
  let editingTrickId = null;

  const tricksContainer =
    document.getElementById("tricks");

  const modal =
    document.getElementById("trickModal");

  const trickForm =
    document.getElementById("trickForm");

  const modalTitle =
    document.getElementById("modalTitle");

  const trickName =
    document.getElementById("trickName");

  const category =
    document.getElementById("category");

  const notes =
    document.getElementById("notes");

  const visibility =
    document.getElementById("visibility");

  const formStatus =
    document.getElementById("formStatus");

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(date) {

    return new Date(date).toLocaleDateString(
      undefined,
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );
  }

  function getSelectedConfidence() {

    const selected =
      document.querySelector(
        'input[name="confidence"]:checked'
      );

    return selected
      ? Number(selected.value)
      : 1;
  }

  function setConfidence(value) {

    const input =
      document.querySelector(
        `input[name="confidence"][value="${value}"]`
      );

    if (input) {
      input.checked = true;
    }
  }

  function showFormError(message) {

    formStatus.textContent = message;
    formStatus.className =
      "status show error";
  }

  function clearFormError() {

    formStatus.textContent = "";
    formStatus.className = "status";
  }

  function openModal(trick = null) {

    clearFormError();

    if (trick) {

      editingTrickId = trick.id;

      modalTitle.textContent =
        "EDIT TRICK.";

      trickName.value =
        trick.name || "";

      category.value =
        trick.category || "";

      notes.value =
        trick.notes || "";

      visibility.value =
        trick.visibility || "private";

      setConfidence(
        trick.confidence || 1
      );

    } else {

      editingTrickId = null;

      modalTitle.textContent =
        "LOG TRICK.";

      trickForm.reset();

      setConfidence(1);

      visibility.value =
        "private";
    }

    modal.classList.add("open");

    setTimeout(() => {
      trickName.focus();
    }, 50);
  }

  function closeModal() {

    modal.classList.remove("open");

    editingTrickId = null;

    trickForm.reset();

    setConfidence(1);

    clearFormError();
  }

  function renderStats() {

    const count =
      tricks.length;

    const average =
      count
        ? (
            tricks.reduce(
              (sum, trick) =>
                sum + Number(trick.confidence || 0),
              0
            ) / count
          ).toFixed(1)
        : "0.0";

    const publicCount =
      tricks.filter(
        trick =>
          trick.visibility === "public"
      ).length;

    document.getElementById(
      "trickCount"
    ).textContent = count;

    document.getElementById(
      "averageConfidence"
    ).textContent = average;

    document.getElementById(
      "publicCount"
    ).textContent = publicCount;
  }

  function renderTricks() {

    if (!tricks.length) {

      tricksContainer.innerHTML = `

        <div class="empty">

          <strong>
            NO TRICKS LOGGED.
          </strong>

          <p>
            Start documenting your progression.
            Every landed trick belongs in the archive.
          </p>

        </div>
      `;

      return;
    }

    tricksContainer.innerHTML =
      tricks.map(trick => {

        const confidence =
          Number(trick.confidence || 1);

        return `

          <article
            class="trick-card"
            data-id="${trick.id}"
          >

            <div class="trick-top">

              <div>

                ${
                  trick.category
                    ? `
                      <div class="category">
                        ${escapeHtml(
                          trick.category
                        )}
                      </div>
                    `
                    : ""
                }

                <div class="trick-name">
                  ${escapeHtml(
                    trick.name
                  )}
                </div>

              </div>

              <div
                class="visibility ${
                  trick.visibility === "public"
                    ? "public"
                    : ""
                }"
              >
                ${
                  trick.visibility === "public"
                    ? "PUBLIC"
                    : "PRIVATE"
                }
              </div>

            </div>

            <div class="confidence">

              <div class="confidence-row">

                <span>
                  CONFIDENCE
                </span>

                <span>
                  ${confidence}/5
                </span>

              </div>

              <div class="bar">

                <div
                  class="bar-fill"
                  style="width:${confidence * 20}%"
                ></div>

              </div>

            </div>

            ${
              trick.notes
                ? `
                  <div class="notes">
                    ${escapeHtml(
                      trick.notes
                    )}
                  </div>
                `
                : ""
            }

            <div class="date">
              LOGGED ${formatDate(
                trick.created_at
              )}
            </div>

            <div class="card-actions">

              <button
                class="clips-button"
                onclick="openClips('${trick.id}')"
              >
                OPEN / CLIPS
              </button>

              <button
                onclick="editTrick('${trick.id}')"
              >
                EDIT
              </button>

              <button
                class="delete-button"
                onclick="deleteTrick('${trick.id}')"
              >
                DELETE
              </button>

            </div>

          </article>
        `;

      }).join("");
  }

  async function loadTricks() {

    const {
      data,
      error
    } = await client
      .from("tricks")
      .select(`
        id,
        name,
        category,
        confidence,
        notes,
        visibility,
        created_at,
        updated_at
      `)
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.error(error);

      tricksContainer.innerHTML = `
        <div class="empty">
          <strong>COULD NOT LOAD ARCHIVE.</strong>
          <p>Please refresh and try again.</p>
        </div>
      `;

      return;
    }

    tricks = data || [];

    renderStats();
    renderTricks();
  }

  async function createTrick(formData) {

    const confidence =
      formData.confidence;

    const {
      data: trick,
      error
    } = await client
      .from("tricks")
      .insert({
        user_id: currentUser.id,
        name: formData.name,
        category: formData.category || null,
        confidence,
        notes: formData.notes || null,
        visibility: formData.visibility
      })
      .select()
      .single();

    if (error) {
      throw error;
    }

    /*
     * Create the first progression session.
     */
    const {
      error: sessionError
    } = await client
      .from("sessions")
      .insert({
        trick_id: trick.id,
        user_id: currentUser.id,
        confidence,
        notes: formData.notes || null
      });

    if (sessionError) {

      /*
       * If the session fails, remove
       * the trick so we don't leave
       * half-created progression data.
       */
      await client
        .from("tricks")
        .delete()
        .eq("id", trick.id);

      throw sessionError;
    }
  }

  async function updateTrick(
    trickId,
    formData
  ) {

    const {
      error
    } = await client
      .from("tricks")
      .update({
        name: formData.name,
        category: formData.category || null,
        confidence: formData.confidence,
        notes: formData.notes || null,
        visibility: formData.visibility,
        updated_at: new Date().toISOString()
      })
      .eq("id", trickId)
      .eq("user_id", currentUser.id);

    if (error) {
      throw error;
    }
  }

  trickForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearFormError();

      const name =
        trickName.value.trim();

      if (!name) {

        showFormError(
          "Enter a trick name."
        );

        return;
      }

      const formData = {

        name,

        category:
          category.value,

        confidence:
          getSelectedConfidence(),

        notes:
          notes.value.trim(),

        visibility:
          visibility.value

      };

      const saveButton =
        trickForm.querySelector(
          ".save-button"
        );

      saveButton.disabled = true;
      saveButton.textContent =
        "SAVING...";

      try {

        if (editingTrickId) {

          await updateTrick(
            editingTrickId,
            formData
          );

        } else {

          await createTrick(
            formData
          );
        }

        closeModal();

        await loadTricks();

      } catch (error) {

        console.error(error);

        showFormError(
          error.message ||
          "Could not save trick."
        );

      } finally {

        saveButton.disabled = false;
        saveButton.textContent =
          "SAVE TRICK";
      }
    }
  );

  window.editTrick = function(id) {

    const trick =
      tricks.find(
        item => item.id === id
      );

    if (!trick) {
      return;
    }

    openModal(trick);
  };

  window.openClips = function(id) {

    window.location.href =
      "./trick.html?id=" +
      encodeURIComponent(id);
  };

  window.deleteTrick = async function(id) {

    const trick =
      tricks.find(
        item => item.id === id
      );

    if (!trick) {
      return;
    }

    const confirmed =
      confirm(
        `Delete "${trick.name}" from your archive? This will also delete its progression sessions.`
      );

    if (!confirmed) {
      return;
    }

    const {
      error
    } = await client
      .from("tricks")
      .delete()
      .eq("id", id)
      .eq("user_id", currentUser.id);

    if (error) {

      console.error(error);

      alert(
        "Could not delete this trick."
      );

      return;
    }

    await loadTricks();
  };

  document
    .getElementById("addTrickButton")
    .addEventListener(
      "click",
      () => openModal()
    );

  document
    .getElementById("closeModal")
    .addEventListener(
      "click",
      closeModal
    );

  document
    .getElementById("cancelButton")
    .addEventListener(
      "click",
      closeModal
    );

  modal.addEventListener(
    "click",
    event => {

      if (event.target === modal) {
        closeModal();
      }

    }
  );

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape" &&
        modal.classList.contains("open")
      ) {
        closeModal();
      }

    }
  );

  document
    .getElementById("signOutButton")
    .addEventListener(
      "click",
      async () => {

        await client.auth.signOut();

        window.location.href =
          "./auth.html";
      }
    );

  async function init() {

    const {
      data: { session },
      error
    } = await client.auth.getSession();

    if (error || !session) {

      window.location.href =
        "./auth.html";

      return;
    }

    currentUser =
      session.user;

    /*
     * Load profile username
     */
    const {
      data: profile
    } = await client
      .from("profiles")
      .select("username")
      .eq("id", currentUser.id)
      .single();

    document.getElementById(
      "userName"
    ).textContent =
      profile?.username
        ? "@" + profile.username
        : "";

    await loadTricks();
  }

  init();

</script>

</body>
</html>
