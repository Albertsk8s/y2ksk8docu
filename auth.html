<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>y2ksk8docu — Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Creepster&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(229, 9, 20, 0.15), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(229, 9, 20, 0.1), transparent 30%),
        #050505;
      color: #fff;
      font-family: "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .auth-shell {
      width: 100%;
      max-width: 470px;
      position: relative;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e50914;
      color: #050505;
      font-family: "Creepster", cursive;
      font-size: 35px;
      transform: rotate(-5deg);
      box-shadow: 7px 7px 0 #fff;
    }

    .brand-name {
      font-family: "Bebas Neue", sans-serif;
      font-size: 38px;
      letter-spacing: 2px;
    }

    .brand-sub {
      color: #888;
      font-family: "Permanent Marker", cursive;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: rgba(15, 15, 15, 0.9);
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 25px 80px rgba(0,0,0,.55);
      backdrop-filter: blur(15px);
    }

    .form-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: 44px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .form-subtitle {
      color: #888;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #0a0a0a;
      color: #fff;
      outline: none;
      font-size: 15px;
      transition: .2s ease;
    }

    input:focus {
      border-color: #e50914;
      box-shadow: 0 0 0 3px rgba(229, 9, 20, .12);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #e50914;
      color: #fff;
      font-family: "Bebas Neue", sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: .2s ease;
      margin-top: 4px;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(229, 9, 20, .25);
    }

    .primary-btn:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .switch-text {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 22px;
    }

    .switch-link {
      border: 0;
      background: transparent;
      color: #e50914;
      font-family: "Inter", sans-serif;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }

    .switch-link:hover {
      text-decoration: underline;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #666;
      text-decoration: none;
      font-size: 12px;
      transition: .2s ease;
    }

    .back-home:hover {
      color: #fff;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px 15px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: rgba(229, 9, 20, .1);
      border: 1px solid rgba(229, 9, 20, .35);
      color: #ff7278;
    }

    .message.success {
      display: block;
      background: rgba(50, 205, 50, .08);
      border: 1px solid rgba(50, 205, 50, .25);
      color: #8be28b;
    }

    .hidden {
      display: none !important;
    }

    .skate-line {
      width: 70px;
      height: 4px;
      background: #e50914;
      margin: 0 0 24px;
      transform: skewX(-25deg);
    }

    @media (max-width: 520px) {
      .card {
        padding: 25px 20px;
      }

      .form-title {
        font-size: 38px;
      }

      .brand-name {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="auth-shell">

    <div class="brand">
      <div class="brand-mark">Y</div>
      <div class="brand-name">y2ksk8docu</div>
      <div class="brand-sub">land it. film it. refine it.</div>
    </div>

    <div class="card">

      <!-- LOGIN -->
      <section id="loginSection">

        <div class="form-title">SIGN IN.</div>
        <div class="skate-line"></div>

        <p class="form-subtitle">
          Get back into your skate archive and keep progressing.
        </p>

        <div id="loginMessage" class="message"></div>

        <form id="loginForm">

          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input
              type="email"
              id="loginEmail"
              placeholder="you@email.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              placeholder="••••••••"
              required
            >
          </div>

          <button type="submit" class="primary-btn" id="loginButton">
            ENTER ARCHIVE →
          </button>

        </form>

        <div class="switch-text">
          Don't have an account?
          <button
            type="button"
            class="switch-link"
            id="showSignup"
          >
            CREATE
          </button>
        </div>

      </section>


      <!-- SIGN UP -->
      <section id="signupSection" class="hidden">

        <div class="form-title">CREATE.</div>
        <div class="skate-line"></div>

        <p class="form-subtitle">
          Start documenting your progression. Your archive is yours.
        </p>

        <div id="signupMessage" class="message"></div>

        <form id="signupForm">

          <div class="form-group">
            <label for="signupUsername">Username</label>
            <input
              type="text"
              id="signupUsername"
              placeholder="skatername"
              minlength="3"
              maxlength="30"
              required
            >
          </div>

          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input
              type="email"
              id="signupEmail"
              placeholder="you@email.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input
              type="password"
              id="signupPassword"
              placeholder="••••••••"
              minlength="6"
              required
            >
          </div>

          <button type="submit" class="primary-btn" id="signupButton">
            CREATE ACCOUNT →
          </button>

        </form>

        <div class="switch-text">
          Already have an account?
          <button
            type="button"
            class="switch-link"
            id="showLogin"
          >
            SIGN IN
          </button>
        </div>

      </section>

    </div>

    <a href="index.html" class="back-home">
      ← BACK TO HOME
    </a>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>

    const loginSection = document.getElementById("loginSection");
    const signupSection = document.getElementById("signupSection");

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const showSignup = document.getElementById("showSignup");
    const showLogin = document.getElementById("showLogin");

    const loginMessage = document.getElementById("loginMessage");
    const signupMessage = document.getElementById("signupMessage");

    const loginButton = document.getElementById("loginButton");
    const signupButton = document.getElementById("signupButton");


    // -------------------------
    // SWITCH TO SIGN UP
    // -------------------------

    showSignup.addEventListener("click", function(event) {
      event.preventDefault();

      loginSection.classList.add("hidden");
      signupSection.classList.remove("hidden");

      clearMessages();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });


    // -------------------------
    // SWITCH TO LOGIN
    // -------------------------

    showLogin.addEventListener("click", function(event) {
      event.preventDefault();

      signupSection.classList.add("hidden");
      loginSection.classList.remove("hidden");

      clearMessages();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });


    // -------------------------
    // LOGIN
    // -------------------------

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      clearMessages();

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      loginButton.disabled = true;
      loginButton.textContent = "SIGNING IN...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        showMessage(
          loginMessage,
          error.message,
          "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "ENTER ARCHIVE →";

        return;
      }


      if (data.session && data.user) {

        window.location.href = "dashboard.html";

      } else {

        showMessage(
          loginMessage,
          "Login successful, but no active session was created.",
          "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "ENTER ARCHIVE →";
      }

    });


    // -------------------------
    // SIGN UP
    // -------------------------

    signupForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      clearMessages();

      const username =
        document.getElementById("signupUsername").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;


      if (username.length < 3) {

        showMessage(
          signupMessage,
          "Username must be at least 3 characters.",
          "error"
        );

        return;
      }


      signupButton.disabled = true;
      signupButton.textContent = "CREATING...";


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              username: username
            }

          }

        });


      if (error) {

        showMessage(
          signupMessage,
          error.message,
          "error"
        );

        signupButton.disabled = false;
        signupButton.textContent = "CREATE ACCOUNT →";

        return;
      }


      // If email confirmation is OFF,
      // Supabase gives us a session immediately.

      if (data.session && data.user) {

        const { error: profileError } =
          await supabaseClient
            .from("profiles")
            .insert({

              id: data.user.id,

              username: username

            });


        if (profileError) {

          console.error(
            "Profile creation error:",
            profileError
          );

          showMessage(
            signupMessage,
            "Account created, but your profile could not be created. You can still continue.",
            "error"
          );

          signupButton.disabled = false;
          signupButton.textContent = "CREATE ACCOUNT →";

          return;
        }


        window.location.href = "dashboard.html";

        return;
      }


      // Your Supabase setup currently uses
      // email confirmation.

      showMessage(
        signupMessage,
        "ACCOUNT CREATED. Check your email to verify your account, then come back and sign in.",
        "success"
      );


      signupForm.reset();

      signupButton.disabled = false;
      signupButton.textContent = "CREATE ACCOUNT →";

    });


    // -------------------------
    // MESSAGE HELPERS
    // -------------------------

    function showMessage(element, text, type) {

      element.textContent = text;

      element.className = "message " + type;

    }


    function clearMessages() {

      loginMessage.textContent = "";
      loginMessage.className = "message";

      signupMessage.textContent = "";
      signupMessage.className = "message";

    }

  </script>

</body>
</html>
