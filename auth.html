<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>y2ksk8docu — Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Creepster&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 58px;
      height: 58px;
      background: #e50914;
      color: #050505;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Creepster, cursive;
      font-size: 36px;
      transform: rotate(-5deg);
      box-shadow: 6px 6px white;
    }

    .brand-name {
      font-family: "Bebas Neue", sans-serif;
      font-size: 38px;
      letter-spacing: 2px;
    }

    .tagline {
      color: #777;
      font-family: "Permanent Marker", cursive;
      font-size: 14px;
    }

    .card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 32px;
    }

    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 46px;
      letter-spacing: 1px;
    }

    .line {
      width: 65px;
      height: 4px;
      background: #e50914;
      margin: 5px 0 22px;
      transform: skewX(-25deg);
    }

    .description {
      color: #888;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 15px;
      background: #080808;
      border: 1px solid #333;
      border-radius: 11px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #e50914;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 11px;
      background: #e50914;
      color: white;
      font-family: "Bebas Neue", sans-serif;
      font-size: 21px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .switch {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 22px;
    }

    .switch button {
      width: auto;
      padding: 0;
      margin-left: 4px;
      background: none;
      color: #e50914;
      font-family: Inter, sans-serif;
      font-size: 13px;
      font-weight: 800;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      display: block;
      color: #ff7378;
      background: rgba(229, 9, 20, .1);
      border: 1px solid rgba(229, 9, 20, .3);
    }

    .success {
      display: block;
      color: #8be28b;
      background: rgba(50, 205, 50, .08);
      border: 1px solid rgba(50, 205, 50, .25);
    }

    .hidden {
      display: none;
    }

    .home {
      display: block;
      text-align: center;
      color: #666;
      text-decoration: none;
      font-size: 12px;
      margin-top: 20px;
    }

    .home:hover {
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">Y</div>

    <div class="brand-name">
      y2ksk8docu
    </div>

    <div class="tagline">
      land it. film it. refine it.
    </div>
  </div>


  <div class="card">

    <!-- LOGIN -->

    <div id="loginBox">

      <h1>SIGN IN.</h1>

      <div class="line"></div>

      <p class="description">
        Get back into your skate archive and keep progressing.
      </p>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm">

        <div class="field">

          <label>Email</label>

          <input
            id="loginEmail"
            type="email"
            required
            placeholder="you@email.com"
          >

        </div>


        <div class="field">

          <label>Password</label>

          <input
            id="loginPassword"
            type="password"
            required
            placeholder="••••••••"
          >

        </div>


        <button
          id="loginButton"
          type="submit"
        >
          ENTER ARCHIVE →
        </button>

      </form>


      <div class="switch">

        Don't have an account?

        <button
          id="createButton"
          type="button"
        >
          CREATE
        </button>

      </div>

    </div>


    <!-- CREATE ACCOUNT -->

    <div
      id="signupBox"
      class="hidden"
    >

      <h1>CREATE.</h1>

      <div class="line"></div>

      <p class="description">
        Start documenting your skate progression.
      </p>

      <div
        id="signupMessage"
        class="message"
      ></div>


      <form id="signupForm">

        <div class="field">

          <label>Username</label>

          <input
            id="signupUsername"
            type="text"
            minlength="3"
            maxlength="30"
            required
            placeholder="skatername"
          >

        </div>


        <div class="field">

          <label>Email</label>

          <input
            id="signupEmail"
            type="email"
            required
            placeholder="you@email.com"
          >

        </div>


        <div class="field">

          <label>Password</label>

          <input
            id="signupPassword"
            type="password"
            minlength="6"
            required
            placeholder="••••••••"
          >

        </div>


        <button
          id="signupButton"
          type="submit"
        >
          CREATE ACCOUNT →
        </button>

      </form>


      <div class="switch">

        Already have an account?

        <button
          id="loginButtonSwitch"
          type="button"
        >
          SIGN IN
        </button>

      </div>

    </div>

  </div>


  <a
    class="home"
    href="index.html"
  >
    ← BACK TO HOME
  </a>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

  // --------------------------------
  // CHECK SUPABASE
  // --------------------------------

  if (
    typeof window.supabase === "undefined"
  ) {

    console.error(
      "Supabase library did not load."
    );

  }

  if (
    typeof supabaseClient === "undefined"
  ) {

    console.error(
      "supabaseClient is not defined. Check supabase.js."
    );

  }


  // --------------------------------
  // ELEMENTS
  // --------------------------------

  const loginBox =
    document.getElementById("loginBox");

  const signupBox =
    document.getElementById("signupBox");

  const createButton =
    document.getElementById("createButton");

  const loginButtonSwitch =
    document.getElementById("loginButtonSwitch");

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const loginMessage =
    document.getElementById("loginMessage");

  const signupMessage =
    document.getElementById("signupMessage");

  const loginButton =
    document.getElementById("loginButton");

  const signupButton =
    document.getElementById("signupButton");


  // --------------------------------
  // SHOW CREATE ACCOUNT
  // --------------------------------

  createButton.addEventListener(
    "click",
    function () {

      loginBox.classList.add("hidden");

      signupBox.classList.remove("hidden");

      loginMessage.className = "message";

      loginMessage.textContent = "";

      signupMessage.className = "message";

      signupMessage.textContent = "";

      window.scrollTo(0, 0);

    }
  );


  // --------------------------------
  // SHOW LOGIN
  // --------------------------------

  loginButtonSwitch.addEventListener(
    "click",
    function () {

      signupBox.classList.add("hidden");

      loginBox.classList.remove("hidden");

      signupMessage.className = "message";

      signupMessage.textContent = "";

      loginMessage.className = "message";

      loginMessage.textContent = "";

      window.scrollTo(0, 0);

    }
  );


  // --------------------------------
  // LOGIN
  // --------------------------------

  loginForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      loginMessage.className =
        "message";

      loginMessage.textContent =
        "";


      loginButton.disabled =
        true;

      loginButton.textContent =
        "SIGNING IN...";


      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      try {

        if (
          typeof supabaseClient ===
          "undefined"
        ) {

          throw new Error(
            "Supabase is not connected. Check supabase.js."
          );

        }


        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          throw error;

        }


        if (
          data &&
          data.session
        ) {

          // --------------------------------
          // MAKE SURE PROFILE EXISTS
          // --------------------------------

          const username =
            data.user.user_metadata?.username;


          if (username) {

            const {
              data: existingProfile,
              error: profileLookupError
            } =
              await supabaseClient
                .from("profiles")
                .select("id")
                .eq(
                  "id",
                  data.user.id
                )
                .maybeSingle();


            if (
              profileLookupError
            ) {

              console.error(
                "PROFILE LOOKUP ERROR:",
                profileLookupError
              );

            }


            if (
              !existingProfile
            ) {

              const {
                error: profileError
              } =
                await supabaseClient
                  .from("profiles")
                  .insert({

                    id: data.user.id,

                    username: username

                  });


              if (
                profileError
              ) {

                console.error(
                  "PROFILE CREATION ERROR:",
                  profileError
                );

              }

            }

          }


          window.location.href =
            "dashboard.html";

          return;

        }


        throw new Error(
          "Login succeeded, but no session was created."
        );


      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );


        loginMessage.textContent =
          error.message ||
          "Something went wrong while signing in.";


        loginMessage.className =
          "message error";

      } finally {

        loginButton.disabled =
          false;

        loginButton.textContent =
          "ENTER ARCHIVE →";

      }

    }
  );


  // --------------------------------
  // CREATE ACCOUNT
  // --------------------------------

  signupForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      signupMessage.className =
        "message";

      signupMessage.textContent =
        "";


      signupButton.disabled =
        true;

      signupButton.textContent =
        "CREATING...";


      const username =
        document
          .getElementById("signupUsername")
          .value
          .trim();


      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      try {

        // --------------------------------
        // CHECK SUPABASE
        // --------------------------------

        if (
          typeof supabaseClient ===
          "undefined"
        ) {

          throw new Error(
            "Supabase is not connected. Check supabase.js."
          );

        }


        // --------------------------------
        // VALIDATE USERNAME
        // --------------------------------

        if (
          username.length < 3
        ) {

          throw new Error(
            "Username must be at least 3 characters."
          );

        }


        // --------------------------------
        // CREATE ACCOUNT
        // --------------------------------

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                username: username

              }

            }

          });


        console.log(
          "SIGNUP RESPONSE:",
          data
        );


        // --------------------------------
        // SUPABASE ERROR
        // --------------------------------

        if (error) {

          throw error;

        }


        // --------------------------------
        // NO USER RETURNED
        // --------------------------------

        if (
          !data ||
          !data.user
        ) {

          throw new Error(
            "Account creation failed. Please try again."
          );

        }


        // --------------------------------
        // EMAIL CONFIRMATION ON
        // --------------------------------

        if (
          !data.session
        ) {

          signupMessage.textContent =
            "ACCOUNT CREATED. Check your email to verify your account, then sign in.";

          signupMessage.className =
            "message success";

          signupForm.reset();

          return;

        }


        // --------------------------------
        // CREATE PROFILE
        // --------------------------------

        const {
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .insert({

              id: data.user.id,

              username: username

            });


        if (
          profileError
        ) {

          console.error(
            "PROFILE CREATION ERROR:",
            profileError
          );

        }


        // --------------------------------
        // GO TO DASHBOARD
        // --------------------------------

        window.location.href =
          "dashboard.html";


      } catch (error) {

        console.error(
          "SIGNUP ERROR:",
          error
        );


        signupMessage.textContent =
          error.message ||
          "Something went wrong while creating your account.";


        signupMessage.className =
          "message error";


      } finally {

        signupButton.disabled =
          false;

        signupButton.textContent =
          "CREATE ACCOUNT →";

      }

    }
  );

</script>

</body>
</html>
