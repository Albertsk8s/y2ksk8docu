  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase connection -->
  <script src="supabase.js"></script>


  <script>

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const loginButton = document.getElementById("loginButton");
    const signupButton = document.getElementById("signupButton");

    const message = document.getElementById("message");


    // -----------------------------
    // SWITCH BETWEEN LOGIN / SIGNUP
    // -----------------------------

    loginTab.addEventListener("click", () => {

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");

      clearMessage();

    });


    signupTab.addEventListener("click", () => {

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");

      clearMessage();

    });


    // -----------------------------
    // LOGIN
    // -----------------------------

    loginButton.addEventListener("click", async () => {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      if (!email || !password) {
        showMessage("Enter your email and password.", "error");
        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = "SIGNING IN...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        showMessage(error.message, "error");

        loginButton.disabled = false;
        loginButton.textContent = "SIGN IN →";

        return;
      }


      showMessage("You're in. Loading your archive...", "success");

      window.location.href = "dashboard.html";

    });


    // -----------------------------
    // SIGN UP
    // -----------------------------

    signupButton.addEventListener("click", async () => {

      const username =
        document.getElementById("signupUsername").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;


      if (!username || !email || !password) {

        showMessage(
          "Fill out your username, email, and password.",
          "error"
        );

        return;
      }


      if (username.length < 3) {

        showMessage(
          "Username must be at least 3 characters.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      signupButton.disabled = true;
      signupButton.textContent = "CREATING...";


      // Create the Supabase authentication account

      const { data, error } =
        await supabaseClient.auth.signUp({
          email,
          password
        });


      if (error) {

        showMessage(error.message, "error");

        signupButton.disabled = false;
        signupButton.textContent = "CREATE ACCOUNT →";

        return;
      }


      // Create the user's profile

      if (data.user) {

        const { error: profileError } =
          await supabaseClient
            .from("profiles")
            .insert({
              id: data.user.id,
              username: username
            });


        if (profileError) {

          showMessage(
            profileError.message,
            "error"
          );

          signupButton.disabled = false;
          signupButton.textContent = "CREATE ACCOUNT →";

          return;
        }
      }


      showMessage(
        "Account created. Welcome to the archive.",
        "success"
      );


      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);

    });


    // -----------------------------
    // MESSAGE HELPERS
    // -----------------------------

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";

    }

  </script>

</body>
