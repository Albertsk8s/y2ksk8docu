    }

    .submit-btn {

      border: none;
      background: #e00000;

  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YOUR SUPABASE CONNECTION -->

  <script src="./supabase.js"></script>

  <!-- AUTHENTICATION -->

  <script>

    const authForm = document.getElementById("authForm");
    const loginMode = document.getElementById("loginMode");
    const signupMode = document.getElementById("signupMode");

    const usernameField = document.getElementById("usernameField");
    const usernameInput = document.getElementById("username");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const submitBtn = document.getElementById("submitBtn");

    const title = document.getElementById("title");
    const intro = document.getElementById("intro");
    const message = document.getElementById("message");


    let mode = "login";


    // ============================================
    // CHECK SUPABASE CONNECTION
    // ============================================

    if (!window.supabaseClient) {

      showMessage(
        "Supabase connection could not be loaded. Check your supabase.js file.",
        "error"
      );

      submitBtn.disabled = true;
    }


    // ============================================
    // MESSAGE
    // ============================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className = "message " + type;
    }


    // ============================================
    // LOGIN MODE
    // ============================================

    loginMode.addEventListener("click", function () {

      mode = "login";

      loginMode.classList.add("active");
      signupMode.classList.remove("active");

      usernameField.style.display = "none";

      usernameInput.required = false;

      title.textContent = "SIGN IN.";

      intro.textContent =
        "Welcome back. Pick up where you left off.";

      submitBtn.textContent = "SIGN IN →";

      passwordInput.autocomplete = "current-password";

      message.className = "message";
      message.textContent = "";
    });


    // ============================================
    // CREATE ACCOUNT MODE
    // ============================================

    signupMode.addEventListener("click", function () {

      mode = "signup";

      signupMode.classList.add("active");
      loginMode.classList.remove("active");

      usernameField.style.display = "block";

      usernameInput.required = true;

      title.textContent = "JOIN THE ARCHIVE.";

      intro.textContent =
        "Create your account and start documenting your progression.";

      submitBtn.textContent = "CREATE ACCOUNT →";

      passwordInput.autocomplete = "new-password";

      message.className = "message";
      message.textContent = "";
    });


    // ============================================
    // FORM SUBMISSION
    // ============================================

    authForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      if (!window.supabaseClient) {

        showMessage(
          "Supabase is not connected. Check supabase.js.",
          "error"
        );

        return;
      }


      const email = emailInput.value.trim();

      const password = passwordInput.value;

      const username = usernameInput.value.trim();


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;
      }


      if (mode === "signup" && !username) {

        showMessage(
          "Please choose a username.",
          "error"
        );

        return;
      }


      submitBtn.disabled = true;

      submitBtn.textContent =
        mode === "signup"
          ? "CREATING..."
          : "SIGNING IN...";


      try {


        // ========================================
        // CREATE ACCOUNT
        // ========================================

        if (mode === "signup") {

          const { data, error } =
            await window.supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {
                data: {
                  username: username
                }
              }

            });


          if (error) {
            throw error;
          }


          if (!data || !data.user) {

            throw new Error(
              "Account creation did not return a user."
            );

          }


          // --------------------------------------
          // EMAIL CONFIRMATION IS ON
          // --------------------------------------

          if (!data.session) {

            showMessage(
              "ACCOUNT CREATED. Check your email to verify your account, then come back here and sign in.",
              "success"
            );

            authForm.reset();

            return;
          }


          // --------------------------------------
          // IF EMAIL CONFIRMATION IS OFF
          // --------------------------------------

          await createProfile(
            data.user,
            username
          );


          window.location.href = "dashboard.html";

          return;
        }


        // ========================================
        // SIGN IN
        // ========================================

        const { data, error } =
          await window.supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {
          throw error;
        }


        if (!data || !data.user) {

          throw new Error(
            "Login did not return a user."
          );

        }


        // --------------------------------------
        // MAKE SURE PROFILE EXISTS
        // --------------------------------------

        const savedUsername =
          data.user.user_metadata?.username ||
          email.split("@")[0];


        await createProfile(
          data.user,
          savedUsername
        );


        // --------------------------------------
        // GO TO DASHBOARD
        // --------------------------------------

        window.location.href = "dashboard.html";


      } catch (error) {

        console.error("AUTH ERROR:", error);

        showMessage(
          error.message || "Something went wrong. Please try again.",
          "error"
        );

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          mode === "signup"
            ? "CREATE ACCOUNT →"
            : "SIGN IN →";
      }

    });


    // ============================================
    // CREATE PROFILE
    // ============================================

    async function createProfile(user, username) {

      if (!user) {
        return;
      }


      const { data: existingProfile, error: profileCheckError } =
        await window.supabaseClient
          .from("profiles")
          .select("id")
          .eq("id", user.id)
          .maybeSingle();


      if (profileCheckError) {

        console.error(
          "PROFILE CHECK ERROR:",
          profileCheckError
        );

        return;
      }


      if (existingProfile) {
        return;
      }


      const { error: profileError } =
        await window.supabaseClient
          .from("profiles")
          .insert({

            id: user.id,

            username: username,

            display_name: username

          });


      if (profileError) {

        // Username may already exist.
        // The account itself can still log in.

        console.error(
          "PROFILE CREATE ERROR:",
          profileError
        );
      }

    }

  </script>
