<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Messages — y2ksk8docu</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>


  <style>

    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=Roboto+Mono:wght@400;500;700&display=swap');


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(190,0,0,.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(255,0,0,.08),

        ),
        #070707;

      color: #f3f3f3;

    }


    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: .07;

          0deg,
          transparent,
          transparent 3px,
          rgba(255,255,255,.05) 4px

    }


    button,
    input,
    textarea {

    }


    button {
      cursor: pointer;
    }


    a {
      color: inherit;

    header {

      height: 82px;

      border-bottom:
        1px solid #252525;

      background:

      position: sticky;

      top: 0;

      z-index: 100;

    nav {

      max-width: 1400px;

      height: 100%;

      align-items: center;

      justify-content: space-between;

    .logo {

        "Permanent Marker",

    .nav-links {

    }

    }

    main {

    }


    .panel {

    /* FRIENDS */

    .friends-panel {

      display: flex;

    }


    .panel-header {

      padding: 20px;

      border-bottom:
        1px solid #252525;

    }


    .panel-title {

        "Bebas Neue",

      letter-spacing: 1px;

    }


    .panel-subtitle {

      color: #666;

      font-size: 9px;

      margin-top: 4px;

    }


    .search-box {

      border-bottom:
        1px solid #252525;

    }


    .search-box input {

    .search-box input:focus {

    .friend-requests {

    }


    .request-title {

    .request {

    }


    .request:last-child {

    .request-name {

    .request-actions {

    .friends-list {

    }


    .friend-username {

    }


    .friend-display {

    }


    .chat-header {

      min-height: 76px;

    .chat-person {

    }


    .messages {

    .empty-chat {

      line-height: 1.8;

      background: #171717;

      border:

      align-self: flex-start;

    }


    .message.mine {

      align-self: flex-end;

    }


    .message-text {

      color: #ddd;

    }


    /* VIDEO MESSAGE */

    .clip-message {

      background: #090909;

      overflow: hidden;

    }


    .clip-trick {

      padding: 11px 13px;

      border-bottom:

    }

    .gallery-grid {

    .clip-card {

    .clip-thumb {

<script>


const client =
  window.supabaseClient;


let currentUser = null;

let friends = [];

let selectedFriend = null;

let selectedConversation = null;

let galleryVideos = [];

let selectedGalleryVideo = null;

let searchTimer = null;


/*
========================================
AUTH
========================================
*/

async function checkAuth() {

  const {
    data: { session },
    error
  } =
    await client.auth.getSession();


  if (
    error ||
    !session
  ) {

    window.location.href =
      "./auth.html";

    return false;

  }


  currentUser =
    session.user;

  return true;

}


/*
========================================
ESCAPE HTML
========================================
*/

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


/*
========================================
LOAD FRIENDS
========================================
*/

async function loadFriends() {

  const {
    data,
    error
  } =
    await client
      .from("friendships")
      .select(`
        id,
        user_id,
        friend_id
      `)
      .or(
        `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
      );


  if (error) {

    console.error(error);

    return;

  }


  const friendIds =
    (data || []).map(row => {

      return row.user_id === currentUser.id
        ? row.friend_id
        : row.user_id;

    });


  if (!friendIds.length) {

    friends = [];

    renderFriends();

    return;

  }


  const {
    data: profiles,
    error: profileError
  } =
    await client
      .from("profiles")
      .select(
        "id, username, display_name, avatar_url"
      )
      .in(
        "id",
        friendIds
      )
      .order(
        "username"
      );


  if (profileError) {

    console.error(profileError);

    return;

  }


  friends =
    profiles || [];


  renderFriends();

}


/*
========================================
RENDER FRIENDS
========================================
*/

function renderFriends() {

  const container =
    document.getElementById(
      "friendsList"
    );


  if (!friends.length) {

    container.innerHTML = `

      <div class="no-friends">

        YOU DON'T HAVE ANY FRIENDS YET.<br><br>

        SEARCH FOR A USERNAME ABOVE<br>

        TO SEND A FRIEND REQUEST.

      </div>

    `;

    return;

  }


  container.innerHTML =
    friends.map(friend => `

      <div
        class="friend"
        data-id="${escapeHTML(friend.id)}"
      >

        <div class="friend-username">

          @${escapeHTML(friend.username)}

        </div>

        <div class="friend-display">

          ${escapeHTML(
            friend.display_name || ""
          )}

        </div>

      </div>

    `).join("");


  container
    .querySelectorAll(".friend")
    .forEach(element => {

      element.addEventListener(
        "click",
        () => {

          const friend =
            friends.find(
              item =>
                item.id ===
                element.dataset.id
            );

          selectFriend(friend);

        }
      );

    });

}


/*
========================================
FRIEND REQUESTS
========================================
*/

async function loadFriendRequests() {

  const {
    data,
    error
  } =
    await client
      .from("friend_requests")
      .select(`
        id,
        sender_id,
        status
      `)
      .eq(
        "receiver_id",
        currentUser.id
      )
      .eq(
        "status",
        "pending"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    return;

  }


  const requests =
    data || [];


  const wrapper =
    document.getElementById(
      "friendRequests"
    );


  const list =
    document.getElementById(
      "requestsList"
    );


  if (!requests.length) {

    wrapper.style.display =
      "none";

    return;

  }


  wrapper.style.display =
    "block";


  const senderIds =
    requests.map(
      request =>
        request.sender_id
    );


  const {
    data: profiles
  } =
    await client
      .from("profiles")
      .select(
        "id, username, display_name"
      )
      .in(
        "id",
        senderIds
      );


  list.innerHTML =
    requests.map(request => {

      const sender =
        (profiles || []).find(
          profile =>
            profile.id ===
            request.sender_id
        );


      return `

        <div
          class="request"
          data-request="${escapeHTML(request.id)}"
        >

          <div class="request-name">

            @${escapeHTML(
              sender?.username ||
              "skater"
            )}

          </div>

          <div class="request-actions">

            <button
              class="small-button accept"
              onclick="acceptRequest('${request.id}')"
            >
              ACCEPT
            </button>

            <button
              class="small-button"
              onclick="declineRequest('${request.id}')"
            >
              DECLINE
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/*
========================================
ACCEPT REQUEST
========================================
*/

async function acceptRequest(
  requestId
) {

  const {
    data: request,
    error
  } =
    await client
      .from("friend_requests")
      .select("*")
      .eq(
        "id",
        requestId
      )
      .eq(
        "receiver_id",
        currentUser.id
      )
      .single();


  if (error || !request) {

    alert(
      "Could not find this request."
    );

    return;

  }


  const {
    error: updateError
  } =
    await client
      .from("friend_requests")
      .update({
        status:
          "accepted"
      })
      .eq(
        "id",
        requestId
      );


  if (updateError) {

    alert(
      updateError.message
    );

    return;

  }


  /*
    Create friendship in both
    directions so queries stay simple.
  */

  const {
    error: friendshipError
  } =
    await client
      .from("friendships")
      .insert([
        {
          user_id:
            currentUser.id,

          friend_id:
            request.sender_id
        },

        {
          user_id:
            request.sender_id,

          friend_id:
            currentUser.id
        }
      ]);


  if (friendshipError) {

    console.error(
      friendshipError
    );

  }


  await loadFriends();

  await loadFriendRequests();

}


/*
========================================
DECLINE
========================================
*/

async function declineRequest(
  requestId
) {

  const {
    error
  } =
    await client
      .from("friend_requests")
      .update({
        status:
          "declined"
      })
      .eq(
        "id",
        requestId
      )
      .eq(
        "receiver_id",
        currentUser.id
      );


  if (error) {

    alert(
      error.message
    );

    return;

  }


  await loadFriendRequests();

}


/*
========================================
SEARCH USERS
========================================
*/

document
  .getElementById("userSearch")
  .addEventListener(
    "input",
    function() {

      clearTimeout(
        searchTimer
      );


      const query =
        this.value.trim();


      if (
        query.length < 2
      ) {

        document
          .getElementById(
            "searchResults"
          )
          .style.display =
          "none";

        return;

      }


      searchTimer =
        setTimeout(
          () => searchUsers(query),
          350
        );

    }
  );


async function searchUsers(
  query
) {

  const {
    data,
    error
  } =
    await client
      .from("profiles")
      .select(
        "id, username, display_name"
      )
      .ilike(
        "username",
        `%${query}%`
      )
      .neq(
        "id",
        currentUser.id
      )
      .limit(10);


  if (error) {

    console.error(error);

    return;

  }


  const results =
    document.getElementById(
      "searchResults"
    );


  results.style.display =
    "block";


  if (!data.length) {

    results.innerHTML = `

      <div class="no-friends">
        NO SKATERS FOUND.
      </div>

    `;

    return;

  }


  results.innerHTML =
    data.map(user => `

      <div class="friend-result">

        <div>

          <div class="friend-result-name">

            @${escapeHTML(
              user.username
            )}

          </div>

          <div class="friend-result-display">

            ${escapeHTML(
              user.display_name || ""
            )}

          </div>

        </div>

        <button
          class="request-button"
          onclick="sendFriendRequest('${user.id}')"
        >
          ADD
        </button>

      </div>

    `).join("");

}


/*
========================================
SEND FRIEND REQUEST
========================================
*/

async function sendFriendRequest(
  receiverId
) {

  if (
    receiverId ===
    currentUser.id
  ) {

    return;

  }


  const {
    error
  } =
    await client
      .from("friend_requests")
      .insert({
        sender_id:
          currentUser.id,

        receiver_id:
          receiverId,

        status:
          "pending"
      });


  if (error) {

    if (
      error.code ===
      "23505"
    ) {

      alert(
        "A friend request already exists."
      );

    } else {

      alert(
        error.message
      );

    }

    return;

  }


  alert(
    "FRIEND REQUEST SENT."
  );


  document
    .getElementById(
      "userSearch"
    )
    .value = "";


  document
    .getElementById(
      "searchResults"
    )
    .style.display =
    "none";

}


/*
========================================
SELECT FRIEND
========================================
*/

async function selectFriend(
  friend
) {

  selectedFriend =
    friend;


  document
    .querySelectorAll(
      ".friend"
    )
    .forEach(element => {

      element.classList.toggle(
        "active",
        element.dataset.id ===
        friend.id
      );

    });


  document
    .getElementById(
      "chatPerson"
    )
    .textContent =
    "@" + friend.username;


  document
    .getElementById(
      "chatStatus"
    )
    .textContent =
    friend.display_name ||
    "FRIEND";


  document
    .getElementById(
      "messageInput"
    )
    .disabled =
    false;


  document
    .getElementById(
      "sendButton"
    )
    .disabled =
    false;


  await getOrCreateConversation();

}


/*
========================================
GET / CREATE CONVERSATION
========================================
*/

async function getOrCreateConversation() {

  /*
    Find conversations the current
    user belongs to.
  */

  const {
    data: myMemberships,
    error
  } =
    await client
      .from("conversation_members")
      .select(
        "conversation_id"
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if (error) {

    console.error(error);

    return;

  }


  let conversationId =
    null;


  for (
    const membership of
    myMemberships || []
  ) {

    const {
      data: otherMember
    } =
      await client
        .from(
          "conversation_members"
        )
        .select(
          "user_id"
        )
        .eq(
          "conversation_id",
          membership.conversation_id
        )
        .eq(
          "user_id",
          selectedFriend.id
        )
        .maybeSingle();


    if (otherMember) {

      conversationId =
        membership.conversation_id;

      break;

    }

  }


  /*
    Create a new conversation
    if one doesn't exist.
  */

  if (!conversationId) {

    const {
      data: conversation,
      error: conversationError
    } =
      await client
        .from("conversations")
        .insert({})
        .select()
        .single();


    if (conversationError) {

      console.error(
        conversationError
      );

      return;

    }


    conversationId =
      conversation.id;


    const {
      error: memberError
    } =
      await client
        .from(
          "conversation_members"
        )
        .insert([
          {
            conversation_id:
              conversationId,

            user_id:
              currentUser.id
          },

          {
            conversation_id:
              conversationId,

            user_id:
              selectedFriend.id
          }
        ]);


    if (memberError) {

      console.error(
        memberError
      );

      return;

    }

  }


  selectedConversation =
    conversationId;


  await loadMessages();

}


/*
========================================
LOAD MESSAGES
========================================
*/

async function loadMessages() {

  const container =
    document.getElementById(
      "messages"
    );


  container.innerHTML = "";


  const {
    data,
    error
  } =
    await client
      .from("messages")
      .select(`
        id,
        sender_id,
        message_text,
        video_id,
        created_at
      `)
      .eq(
        "conversation_id",
        selectedConversation
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    return;

  }


  const messages =
    data || [];


  if (!messages.length) {

    container.innerHTML = `

      <div class="empty-chat">

        NO MESSAGES YET.<br><br>

        SEND SOMETHING.

      </div>

    `;

    return;

  }


  for (
    const message of messages
  ) {

    await renderMessage(
      message
    );

  }


  container.scrollTop =
    container.scrollHeight;

}


/*
========================================
RENDER MESSAGE
========================================
*/

async function renderMessage(
  message
) {

  const container =
    document.getElementById(
      "messages"
    );


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "message " +
    (
      message.sender_id ===
      currentUser.id
        ? "mine"
        : ""
    );


  if (
    message.message_text
  ) {

    const text =
      document.createElement(
        "div"
      );

    text.className =
      "message-text";

    text.textContent =
      message.message_text;

    element.appendChild(
      text
    );

  }


  if (
    message.video_id
  ) {

    await renderVideoMessage(
      message.video_id,
      element
    );

  }


  const time =
    document.createElement(
      "div"
    );

    time.className =
      "message-time";

    time.textContent =
      new Date(
        message.created_at
      ).toLocaleString();


    element.appendChild(
      time
    );


    container.appendChild(
      element
    );

}


/*
========================================
RENDER VIDEO MESSAGE
========================================
*/

async function renderVideoMessage(
  videoId,
  messageElement
) {

  /*
    Get video + session + trick.
  */

  const {
    data: video,
    error
  } =
    await client
      .from("videos")
      .select(`
        id,
        storage_path,
        visibility,
        session_id
      `)
      .eq(
        "id",
        videoId
      )
      .single();


  if (
    error ||
    !video
  ) {

    return;

  }


  const {
    data: session
  } =
    await client
      .from("sessions")
      .select(
        "trick_id"
      )
      .eq(
        "id",
        video.session_id
      )
      .single();


  if (!session) {
    return;
  }


  const {
    data: trick
  } =
    await client
      .from("tricks")
      .select(
        "name, category"
      )
      .eq(
        "id",
        session.trick_id
      )
      .single();


  if (!trick) {
    return;
  }


  let videoUrl =
    null;


  /*
    Public clips.
  */

  if (
    video.visibility ===
    "public"
  ) {

    const {
      data
    } =
      client
        .storage
        .from(
          "public-videos"
        )
        .getPublicUrl(
          video.storage_path
        );


    videoUrl =
      data.publicUrl;

  }


  /*
    Private clips.

    Create a signed URL for the
    person viewing the message.

    NOTE:
    This requires the storage policy
    to permit access to the object.
  */

  else {

    const {
      data,
      error:
        signedError
    } =
      await client
        .storage
        .from(
          "videos"
        )
        .createSignedUrl(
          video.storage_path,
          3600
        );


    if (
      !signedError &&
      data
    ) {

      videoUrl =
        data.signedUrl;

    }

  }


  if (!videoUrl) {

    const unavailable =
      document.createElement(
        "div"
      );

    unavailable.className =
      "clip-message";

    unavailable.innerHTML = `

      <div class="clip-trick">

        ${escapeHTML(
          trick.name
        )}

      </div>

      <div class="clip-caption">

        VIDEO UNAVAILABLE

      </div>

    `;

    messageElement.appendChild(
      unavailable
    );

    return;

  }


  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "clip-message";


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "clip-trick";

  title.textContent =
    trick.name;


  const videoElement =
    document.createElement(
      "video"
    );

  videoElement.className =
    "clip-video";

  videoElement.controls =
    true;

  videoElement.playsInline =
    true;

  videoElement.preload =
    "metadata";

  videoElement.src =
    videoUrl;


  wrapper.appendChild(
    title
  );

  wrapper.appendChild(
    videoElement
  );


  messageElement.appendChild(
    wrapper
  );

}


/*
========================================
COMPOSER
========================================
*/

document
  .getElementById(
    "composer"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (
        !selectedConversation
      ) {

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const text =
        input.value.trim();


      if (!text) {

        return;

      }


      const {
        error
      } =
        await client
          .from("messages")
          .insert({
            conversation_id:
              selectedConversation,

            sender_id:
              currentUser.id,

            message_text:
              text
          });


      if (error) {

        alert(
          error.message
        );

        return;

      }


      input.value =
        "";


      await loadMessages();

    }
  );


/*
========================================
GALLERY
========================================
*/

document
  .getElementById(
    "plusButton"
  )
  .addEventListener(
    "click",
    openGallery
  );


async function openGallery() {

  if (
    !selectedFriend ||
    !selectedConversation
  ) {

    alert(
      "Choose a friend first."
    );

    return;

  }


  selectedGalleryVideo =
    null;


  document
    .getElementById(
      "gallerySearch"
    )
    .value =
    "";


  document
    .getElementById(
      "sendClipButton"
    )
    .disabled =
    true;


  document
    .getElementById(
      "galleryOverlay"
    )
    .classList.add(
      "show"
    );


  await loadGallery();

}


/*
========================================
LOAD USER GALLERY
========================================
*/

async function loadGallery(
  search = ""
) {

  const grid =
    document.getElementById(
      "galleryGrid"
    );


  grid.innerHTML = `

    <div class="no-clips">

      LOADING CLIPS...

    </div>

  `;


  /*
    Get user's video records.
  */

  const {
    data: videos,
    error
  } =
    await client
      .from("videos")
      .select(`
        id,
        storage_path,
        visibility,
        session_id,
        created_at
      `)
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    grid.innerHTML = `

      <div class="no-clips">

        COULD NOT LOAD YOUR GALLERY.

      </div>

    `;

    return;

  }


  if (!videos?.length) {

    grid.innerHTML = `

      <div class="no-clips">

        YOU DON'T HAVE ANY CLIPS YET.<br><br>

        UPLOAD A VIDEO TO ONE OF YOUR
        TRICK SESSIONS FIRST.

      </div>

    `;

    return;

  }


  /*
    Get sessions.
  */

  const sessionIds =
    videos.map(
      video =>
        video.session_id
    );


  const {
    data: sessionsData
  } =
    await client
      .from("sessions")
      .select(
        "id, trick_id"
      )
      .in(
        "id",
        sessionIds
      );


  const trickIds =
    (sessionsData || [])
      .map(
        session =>
          session.trick_id
      );


  const {
    data: tricksData
  } =
    await client
      .from("tricks")
      .select(
        "id, name, category"
      )
      .in(
        "id",
        trickIds
      );


  /*
    Combine everything into
    searchable gallery objects.
  */

  galleryVideos =
    videos.map(video => {

      const session =
        (sessionsData || [])
          .find(
            item =>
              item.id ===
              video.session_id
          );


      const trick =
        (tricksData || [])
          .find(
            item =>
              item.id ===
              session?.trick_id
          );


      return {

        ...video,

        trickName:
          trick?.name ||
          "UNKNOWN TRICK",

        trickCategory:
          trick?.category ||
          ""

      };

    });


  renderGallery(
    search
  );

}


/*
========================================
RENDER GALLERY
========================================
*/

function renderGallery(
  search = ""
) {

  const grid =
    document.getElementById(
      "galleryGrid"
    );


  const normalized =
    search
      .trim()
      .toLowerCase();


  const filtered =
    galleryVideos.filter(
      video => {

        if (!normalized) {
          return true;
        }


        return (

          video.trickName
            .toLowerCase()
            .includes(normalized)

          ||

          video.trickCategory
            .toLowerCase()
            .includes(normalized)

        );

      }
    );


  if (!filtered.length) {

    grid.innerHTML = `

      <div class="no-clips">

        NO CLIPS MATCH "${escapeHTML(search)}".

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered.map(
      video => {

        const selected =
          selectedGalleryVideo?.id ===
          video.id
            ? "selected"
            : "";


        let thumbnailUrl =
          "";


        if (
          video.visibility ===
          "public"
        ) {

          const {
            data
          } =
            client
              .storage
              .from(
                "public-videos"
              )
              .getPublicUrl(
                video.storage_path
              );


          thumbnailUrl =
            data.publicUrl;

        }


        return `

          <div
            class="clip-card ${selected}"
            data-video-id="${escapeHTML(video.id)}"
          >

            <div class="clip-thumb">

              ${
                thumbnailUrl
                  ? `
                    <video
                      src="${escapeHTML(thumbnailUrl)}"
                      muted
                      preload="metadata"
                    ></video>
                  `
                  : `
                    <div
                      style="
                        width:100%;
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#555;
                        font-size:9px;
                      "
                    >
                      PRIVATE CLIP
                    </div>
                  `
              }

            </div>


            <div class="clip-info">

              <div class="clip-name">

                ${escapeHTML(
                  video.trickName
                )}

              </div>

              <div class="clip-category">

                ${escapeHTML(
                  video.trickCategory
                )}

              </div>

              <div class="clip-visibility">

                ${video.visibility.toUpperCase()}

              </div>

            </div>

          </div>

        `;

      }
    ).join("");


  grid
    .querySelectorAll(
      ".clip-card"
    )
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          const video =
            galleryVideos.find(
              item =>
                item.id ===
                card.dataset.videoId
            );


          selectedGalleryVideo =
            video;


          renderGallery(
            document
              .getElementById(
                "gallerySearch"
              )
              .value
          );


          document
            .getElementById(
              "sendClipButton"
            )
            .disabled =
            false;

        }
      );

    });

}


/*
========================================
GALLERY SEARCH
========================================
*/

document
  .getElementById(
    "gallerySearch"
  )
  .addEventListener(
    "input",
    function() {

      renderGallery(
        this.value
      );

    }
  );


/*
========================================
CLOSE GALLERY
========================================
*/

function closeGallery() {

  document
    .getElementById(
      "galleryOverlay"
    )
    .classList.remove(
      "show"
    );

}


document
  .getElementById(
    "closeGallery"
  )
  .addEventListener(
    "click",
    closeGallery
  );


document
  .getElementById(
    "cancelGallery"
  )
  .addEventListener(
    "click",
    closeGallery
  );


document
  .getElementById(
    "galleryOverlay"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeGallery();

      }

    }
  );


/*
========================================
SEND CLIP
========================================
*/

document
  .getElementById(
    "sendClipButton"
  )
  .addEventListener(
    "click",
    sendSelectedClip
  );


async function sendSelectedClip() {

  if (
    !selectedGalleryVideo ||
    !selectedConversation
  ) {

    return;

  }


  const button =
    document.getElementById(
      "sendClipButton"
    );


  button.disabled =
    true;

  button.textContent =
    "SENDING...";


  try {

    /*
      IMPORTANT:

      The message references the
      existing video record.

      The trick name is retrieved
      from the video's session
      when rendering the message.
    */

    const {
      error
    } =
      await client
        .from("messages")
        .insert({
          conversation_id:
            selectedConversation,

          sender_id:
            currentUser.id,

          video_id:
            selectedGalleryVideo.id
        });


    if (error) {

      throw error;

    }


    closeGallery();

    await loadMessages();


  } catch (error) {

    console.error(error);

    alert(
      error.message ||
      "Could not send clip."
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      "SEND CLIP";

  }

}


/*
========================================
REALTIME MESSAGE REFRESH
========================================
*/

client
  .channel(
    "messages-live"
  )
  .on(
    "postgres_changes",
    {
      event: "INSERT",
      schema: "public",
      table: "messages"
    },
    payload => {

      if (
        selectedConversation &&
        payload.new.conversation_id ===
        selectedConversation
      ) {

        loadMessages();

      }

    }
  )
  .subscribe();


/*
========================================
START
========================================
*/

async function start() {

  const authenticated =
    await checkAuth();


  if (!authenticated) {
    return;
  }


  await loadFriends();

  await loadFriendRequests();

}


start();


</script>
