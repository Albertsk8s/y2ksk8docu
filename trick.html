<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>y2ksk8docu — Trick</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090909;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.012) 0px,
          rgba(255,255,255,.012) 1px,
          transparent 1px,
          transparent 4px
        );
      z-index: 20;
    }

    header {
      height: 78px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      color: #e00000;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
    }

    .back {
      color: #888;
      text-decoration: none;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .back:hover {
      color: #e00000;
    }

    main {
      width: min(1000px, 90%);
      margin: 0 auto;
      padding: 65px 0;
    }

    .eyebrow {
      color: #e00000;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(50px, 9vw, 95px);
      line-height: .85;
      letter-spacing: -5px;
      text-transform: uppercase;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .trick-notes {
      color: #777;
      line-height: 1.6;
      max-width: 700px;
      margin-bottom: 40px;
    }

    .panel {
      background: #0f0f0f;
      border: 1px solid #292929;
      padding: 28px;
      margin-bottom: 25px;
    }

    .panel-title {
      color: #e00000;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #888;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    select,
    textarea,
    input[type="file"] {
      width: 100%;
      background: #080808;
      border: 1px solid #303030;
      color: white;
      padding: 14px;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    select:focus,
    textarea:focus,
    input[type="file"]:focus {
      border-color: #e00000;
    }

    .visibility {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .visibility label {
      margin: 0;
    }

    .visibility input {
      display: none;
    }

    .visibility span {
      display: block;
      border: 1px solid #303030;
      padding: 15px;
      text-align: center;
      color: #777;
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .visibility input:checked + span {
      border-color: #e00000;
      color: #e00000;
    }

    .upload-btn {
      width: 100%;
      border: none;
      background: #e00000;
      color: white;
      padding: 17px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .upload-btn:hover {
      background: #ff1616;
    }

    .upload-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    .success {
      color: #65ff92;
    }

    .error {
      color: #ff5555;
    }

    .session {
      border-top: 1px solid #292929;
      padding: 28px 0;
    }

    .session:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 15px;
    }

    .session-number {
      font-weight: 900;
      text-transform: uppercase;
    }

    .session-date {
      color: #666;
      font-size: 11px;
      margin-top: 5px;
    }

    .confidence {
      color: #e00000;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .session-notes {
      color: #888;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    video {
      width: 100%;
      max-height: 600px;
      display: block;
      background: #000;
      border: 1px solid #222;
    }

    .video-tag {
      color: #666;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 9px;
    }

    .empty {
      color: #666;
      padding: 20px 0;
      line-height: 1.6;
    }

    @media (max-width: 650px) {
      main {
        padding: 45px 0;
      }

      .panel {
        padding: 20px;
      }

      .session-header {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="./index.html" class="logo">
    y2ksk8docu
  </a>

  <a href="./dashboard.html" class="back">
    ← MY ARCHIVE
  </a>
</header>


<main>

  <div class="eyebrow">
    TRICK ARCHIVE
  </div>

  <h1 id="trickName">
    LOADING...
  </h1>

  <p class="trick-notes" id="trickNotes"></p>


  <!-- NEW SESSION -->

  <section class="panel">

    <div class="panel-title">
      Log New Session
    </div>

    <form id="sessionForm">

      <div class="field">

        <label for="confidence">
          Confidence
        </label>

        <select id="confidence">

          <option value="1">
            1 — Barely landed
          </option>

          <option value="2">
            2 — Getting there
          </option>

          <option value="3" selected>
            3 — Solid
          </option>

          <option value="4">
            4 — Consistent
          </option>

          <option value="5">
            5 — Automatic
          </option>

        </select>

      </div>


      <div class="field">

        <label for="sessionNotes">
          Session Notes
        </label>

        <textarea
          id="sessionNotes"
          placeholder="What happened today?"
        ></textarea>

      </div>


      <div class="field">

        <label for="videoFile">
          Skate Clip
        </label>

        <input
          id="videoFile"
          type="file"
          accept="video/*"
        >

      </div>


      <div class="field">

        <label>
          Clip Visibility
        </label>

        <div class="visibility">

          <label>

            <input
              type="radio"
              name="visibility"
              value="private"
              checked
            >

            <span>
              PRIVATE
            </span>

          </label>

          <label>

            <input
              type="radio"
              name="visibility"
              value="public"
            >

            <span>
              PUBLIC
            </span>

          </label>

        </div>

      </div>


      <button
        class="upload-btn"
        id="uploadBtn"
        type="submit"
      >
        SAVE SESSION + UPLOAD CLIP
      </button>


      <div
        class="status"
        id="status"
      ></div>

    </form>

  </section>


  <!-- HISTORY -->

  <section class="panel">

    <div class="panel-title">
      Progress History
    </div>

    <div id="sessionList">
      <div class="empty">
        Loading your sessions...
      </div>
    </div>

  </section>

</main>


<script>

  const client = window.supabaseClient;

  let currentUser = null;
  let currentTrick = null;


  // ==========================================
  // GET TRICK ID
  // ==========================================

  function getTrickId() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return params.get("id");
  }


  // ==========================================
  // CHECK AUTH
  // ==========================================

  async function checkAuth() {

    if (!client) {

      throw new Error(
        "Supabase connection is missing."
      );

    }

    const {
      data,
      error
    } = await client.auth.getSession();


    if (error) {
      throw error;
    }


    if (!data.session) {

      window.location.href =
        "./auth.html";

      return false;

    }


    currentUser =
      data.session.user;

    return true;
  }


  // ==========================================
  // LOAD TRICK
  // ==========================================

  async function loadTrick() {

    const trickId =
      getTrickId();


    if (!trickId) {

      throw new Error(
        "No trick was selected."
      );

    }


    const {
      data,
      error
    } = await client
      .from("tricks")
      .select("*")
      .eq("id", trickId)
      .eq("user_id", currentUser.id)
      .single();


    if (error) {
      throw error;
    }


    currentTrick = data;


    document
      .getElementById("trickName")
      .textContent =
        data.name;


    document
      .getElementById("trickNotes")
      .textContent =
        data.notes ||
        "No notes added to this trick yet.";


    document.title =
      data.name +
      " — y2ksk8docu";

  }


  // ==========================================
  // SAVE SESSION
  // ==========================================

  document
    .getElementById("sessionForm")
    .addEventListener(
      "submit",
      saveSession
    );


  async function saveSession(event) {

    event.preventDefault();


    const button =
      document.getElementById("uploadBtn");

    const status =
      document.getElementById("status");


    const confidence =
      Number(
        document.getElementById("confidence").value
      );


    const notes =
      document
        .getElementById("sessionNotes")
        .value
        .trim();


    const file =
      document
        .getElementById("videoFile")
        .files[0];


    const visibility =
      document.querySelector(
        'input[name="visibility"]:checked'
      ).value;


    button.disabled = true;

    status.className =
      "status";

    status.textContent =
      "Saving session...";


    let uploadedPath = null;


    try {

      // ========================================
      // CREATE SESSION
      // ========================================

      const {
        data: session,
        error: sessionError
      } = await client
        .from("sessions")
        .insert({

          trick_id:
            currentTrick.id,

          user_id:
            currentUser.id,

          confidence,

          notes:
            notes || null

        })
        .select()
        .single();


      if (sessionError) {
        throw sessionError;
      }


      // ========================================
      // NO VIDEO
      // ========================================

      if (!file) {

        status.className =
          "status success";

        status.textContent =
          "Session saved.";

        document
          .getElementById("sessionForm")
          .reset();

        await loadSessions();

        return;

      }


      // ========================================
      // FILE NAME
      // ========================================

      const safeName =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const storagePath =
        currentUser.id +
        "/" +
        crypto.randomUUID() +
        "-" +
        safeName;


      uploadedPath =
        storagePath;


      // ========================================
      // UPLOAD
      // ========================================

      status.textContent =
        "Uploading your clip...";


      const {
        error: uploadError
      } = await client
        .storage
        .from("videos")
        .upload(
          storagePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              file.type
          }
        );


      if (uploadError) {
        throw uploadError;
      }


      // ========================================
      // SAVE VIDEO DATABASE RECORD
      // ========================================

      status.textContent =
        "Connecting clip to session...";


      const {
        error: videoError
      } = await client
        .from("videos")
        .insert({

          session_id:
            session.id,

          user_id:
            currentUser.id,

          storage_path:
            storagePath,

          visibility

        });


      if (videoError) {
        throw videoError;
      }


      // ========================================
      // SUCCESS
      // ========================================

      status.className =
        "status success";

      status.textContent =
        "Session and clip saved successfully.";


      document
        .getElementById("sessionForm")
        .reset();


      await loadSessions();


    } catch (error) {

      console.error(error);


      // Remove uploaded file if the
      // database record failed.

      if (uploadedPath) {

        await client
          .storage
          .from("videos")
          .remove([
            uploadedPath
          ]);

      }


      status.className =
        "status error";

      status.textContent =
        error.message ||
        "Upload failed.";


    } finally {

      button.disabled = false;

    }

  }


  // ==========================================
  // LOAD SESSIONS
  // ==========================================

  async function loadSessions() {

    const list =
      document.getElementById(
        "sessionList"
      );


    const {
      data: sessions,
      error
    } = await client
      .from("sessions")
      .select(`
        id,
        confidence,
        notes,
        created_at,
        videos (
          id,
          storage_path,
          visibility,
          created_at
        )
      `)
      .eq(
        "trick_id",
        currentTrick.id
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      list.innerHTML = `
        <div class="empty error">
          ${escapeHTML(error.message)}
        </div>
      `;

      return;

    }


    if (!sessions ||
        sessions.length === 0) {

      list.innerHTML = `
        <div class="empty">
          No sessions yet.
          Log your first one above.
        </div>
      `;

      return;

    }


    list.innerHTML = "";


    for (
      let i = 0;
      i < sessions.length;
      i++
    ) {

      const session =
        sessions[i];


      const sessionElement =
        document.createElement(
          "div"
        );


      sessionElement.className =
        "session";


      const date =
        new Date(
          session.created_at
        ).toLocaleString();


      const video =
        session.videos &&
        session.videos.length > 0
          ? session.videos[0]
          : null;


      let videoHTML =
        "";


      if (video) {

        videoHTML = `

          <div class="video-tag">
            ${video.visibility.toUpperCase()} CLIP
          </div>

          <video
            id="video-${video.id}"
            controls
            playsinline
            preload="metadata"
          ></video>

        `;

      }


      sessionElement.innerHTML = `

        <div class="session-header">

          <div>

            <div class="session-number">
              SESSION ${sessions.length - i}
            </div>

            <div class="session-date">
              ${date}
            </div>

          </div>

          <div class="confidence">
            CONFIDENCE
            ${session.confidence}/5
          </div>

        </div>

        ${
          session.notes
            ? `
              <div class="session-notes">
                ${escapeHTML(session.notes)}
              </div>
            `
            : ""
        }

        ${videoHTML}

      `;


      list.appendChild(
        sessionElement
      );


      // ========================================
      // PRIVATE STORAGE URL
      // ========================================

      if (video) {

        const {
          data: signedData,
          error: signedError
        } = await client
          .storage
          .from("videos")
          .createSignedUrl(
            video.storage_path,
            3600
          );


        if (
          !signedError &&
          signedData &&
          signedData.signedUrl
        ) {

          const player =
            document.getElementById(
              "video-" +
              video.id
            );


          if (player) {

            player.src =
              signedData.signedUrl;

          }

        }

      }

    }

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHTML(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================
  // START
  // ==========================================

  async function start() {

    try {

      const authenticated =
        await checkAuth();


      if (!authenticated) {
        return;
      }


      await loadTrick();

      await loadSessions();


    } catch (error) {

      console.error(error);


      document
        .getElementById("trickName")
        .textContent =
          "ERROR";


      document
        .getElementById("trickNotes")
        .textContent =
          error.message ||
          "Something went wrong.";

    }

  }


  start();

</script>

</body>
</html>
