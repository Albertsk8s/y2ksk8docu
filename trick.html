<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRICK // y2ksk8docu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f2f2f2;
      font-family: "Space Mono", monospace;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          #fff 4px
        );
      z-index: 999;
    }

    header {
      height: 76px;
      border-bottom: 1px solid #252525;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      position: sticky;
      top: 0;
      background: rgba(8, 8, 8, 0.94);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .logo {
      color: #ff2020;
      font-family: "Archivo Black", sans-serif;
      font-size: 22px;
      letter-spacing: -1px;
      text-decoration: none;
    }

    .back {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      transition: 0.2s;
    }

    .back:hover {
      color: #ff2020;
    }

    main {
      width: min(1100px, 90%);
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    .eyebrow {
      color: #ff2020;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(42px, 8vw, 90px);
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -4px;
      word-break: break-word;
      margin-bottom: 20px;
    }

    .notes {
      color: #aaa;
      max-width: 700px;
      line-height: 1.7;
      margin-bottom: 50px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 50px;
    }

    .stat {
      border: 1px solid #292929;
      background: #0d0d0d;
      padding: 25px 20px;
      position: relative;
      overflow: hidden;
    }

    .stat::after {
      content: "";
      position: absolute;
      width: 45px;
      height: 4px;
      background: #ff2020;
      top: 0;
      left: 0;
    }

    .stat-number {
      font-family: "Archivo Black", sans-serif;
      font-size: 38px;
      color: #fff;
      margin-bottom: 8px;
    }

    .stat-label {
      color: #777;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* PROGRESS */

    .progress-section {
      border: 1px solid #292929;
      background: #0d0d0d;
      padding: 28px;
      margin-bottom: 60px;
    }

    .section-title {
      font-family: "Archivo Black", sans-serif;
      font-size: 18px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .confidence-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .confidence-label {
      min-width: 115px;
      font-size: 11px;
      color: #888;
    }

    .bar {
      height: 12px;
      background: #222;
      flex: 1;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #ff2020;
      width: 0%;
      transition: width 0.5s ease;
    }

    .confidence-value {
      min-width: 30px;
      text-align: right;
      color: #ff2020;
      font-weight: bold;
    }

    /* SESSION FORM */

    .form-section {
      border: 1px solid #292929;
      background: #0d0d0d;
      padding: 30px;
      margin-bottom: 60px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      color: #777;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #080808;
      color: white;
      border: 1px solid #333;
      padding: 13px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff2020;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .confidence-options {
      display: flex;
      gap: 8px;
    }

    .confidence-options input {
      display: none;
    }

    .confidence-options label {
      border: 1px solid #333;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #777;
      margin: 0;
      transition: 0.2s;
    }

    .confidence-options label:hover {
      border-color: #ff2020;
      color: white;
    }

    .confidence-options input:checked + label {
      background: #ff2020;
      border-color: #ff2020;
      color: white;
    }

    .submit-btn {
      width: 100%;
      border: none;
      background: #ff2020;
      color: white;
      padding: 16px;
      font-family: "Archivo Black", sans-serif;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:hover {
      background: #fff;
      color: #000;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      font-size: 12px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ff4444;
    }

    .message.success {
      color: #5cff8d;
    }

    /* HISTORY */

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .history-count {
      color: #666;
      font-size: 11px;
    }

    .session {
      border: 1px solid #292929;
      background: #0d0d0d;
      padding: 25px;
      margin-bottom: 15px;
      position: relative;
    }

    .session::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #ff2020;
    }

    .session-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 15px;
    }

    .session-number {
      color: #ff2020;
      font-family: "Archivo Black", sans-serif;
      font-size: 20px;
    }

    .session-date {
      color: #666;
      font-size: 10px;
    }

    .session-confidence {
      display: inline-block;
      border: 1px solid #333;
      padding: 7px 10px;
      font-size: 11px;
      margin-bottom: 15px;
    }

    .session-notes {
      color: #aaa;
      line-height: 1.6;
      font-size: 13px;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-height: 600px;
      background: #000;
      display: block;
    }

    .video-tag {
      margin-bottom: 8px;
      color: #777;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .empty {
      border: 1px dashed #333;
      padding: 50px;
      text-align: center;
      color: #666;
    }

    .loading {
      color: #666;
      padding: 30px 0;
    }

    @media (max-width: 750px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      h1 {
        letter-spacing: -2px;
      }
    }

    @media (max-width: 500px) {
      main {
        width: 92%;
        padding-top: 45px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat {
        padding: 18px 15px;
      }

      .stat-number {
        font-size: 28px;
      }

      .form-section,
      .progress-section {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="dashboard.html" class="logo">Y2KSK8DOCU</a>
  <a href="dashboard.html" class="back">← BACK TO ARCHIVE</a>
</header>

<main>

  <div id="loading" class="loading">
    LOADING TRICK...
  </div>

  <div id="content" style="display:none;">

    <div class="eyebrow">TRICK ARCHIVE //</div>

    <h1 id="trickName">TRICK</h1>

    <div id="trickNotes" class="notes"></div>

    <!-- STATS -->

    <section class="stats">

      <div class="stat">
        <div class="stat-number" id="sessionCount">0</div>
        <div class="stat-label">Sessions Logged</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="startingConfidence">—</div>
        <div class="stat-label">Starting Confidence</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="currentConfidence">—</div>
        <div class="stat-label">Current Confidence</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="bestConfidence">—</div>
        <div class="stat-label">Personal Best</div>
      </div>

    </section>

    <!-- PROGRESS -->

    <section class="progress-section">

      <div class="section-title">
        CONFIDENCE PROGRESSION
      </div>

      <div class="confidence-row">

        <div class="confidence-label">
          CURRENT LEVEL
        </div>

        <div class="bar">
          <div id="confidenceBar" class="bar-fill"></div>
        </div>

        <div id="confidenceValue" class="confidence-value">
          —
        </div>

      </div>

    </section>

    <!-- NEW SESSION -->

    <section class="form-section">

      <div class="section-title">
        LOG NEW SESSION
      </div>

      <form id="sessionForm">

        <div class="form-grid">

          <div class="field">

            <label>Confidence</label>

            <div class="confidence-options">

              <input type="radio" name="confidence" id="c1" value="1" checked>
              <label for="c1">1</label>

              <input type="radio" name="confidence" id="c2" value="2">
              <label for="c2">2</label>

              <input type="radio" name="confidence" id="c3" value="3">
              <label for="c3">3</label>

              <input type="radio" name="confidence" id="c4" value="4">
              <label for="c4">4</label>

              <input type="radio" name="confidence" id="c5" value="5">
              <label for="c5">5</label>

            </div>

          </div>

          <div class="field">

            <label>Video</label>

            <input
              type="file"
              id="videoFile"
              accept="video/*"
            >

          </div>

          <div class="field full">

            <label>Session Notes</label>

            <textarea
              id="sessionNotes"
              placeholder="What happened? What felt better? What needs work?"
            ></textarea>

          </div>

          <div class="field">

            <label>Video Visibility</label>

            <select id="videoVisibility">

              <option value="private">
                PRIVATE
              </option>

              <option value="public">
                PUBLIC
              </option>

            </select>

          </div>

        </div>

        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          LOG SESSION
        </button>

        <div id="formMessage" class="message"></div>

      </form>

    </section>

    <!-- HISTORY -->

    <section>

      <div class="history-header">

        <div class="section-title">
          SESSION HISTORY
        </div>

        <div id="historyCount" class="history-count">
          0 SESSIONS
        </div>

      </div>

      <div id="history"></div>

    </section>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>

<script>

  const client = window.supabaseClient;

  let currentUser = null;
  let currentTrick = null;
  let sessions = [];

  const loading = document.getElementById("loading");
  const content = document.getElementById("content");

  const trickName = document.getElementById("trickName");
  const trickNotes = document.getElementById("trickNotes");

  const sessionCount = document.getElementById("sessionCount");
  const startingConfidence = document.getElementById("startingConfidence");
  const currentConfidence = document.getElementById("currentConfidence");
  const bestConfidence = document.getElementById("bestConfidence");

  const confidenceBar = document.getElementById("confidenceBar");
  const confidenceValue = document.getElementById("confidenceValue");

  const history = document.getElementById("history");
  const historyCount = document.getElementById("historyCount");

  const sessionForm = document.getElementById("sessionForm");
  const submitBtn = document.getElementById("submitBtn");
  const formMessage = document.getElementById("formMessage");

  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(dateString) {

    return new Date(dateString).toLocaleDateString(
      undefined,
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );
  }

  function showMessage(message, type) {

    formMessage.textContent = message;

    formMessage.className = "message show " + type;

  }

  function getTrickId() {

    const params = new URLSearchParams(
      window.location.search
    );

    return params.get("id");

  }

  async function loadTrick() {

    const trickId = getTrickId();

    if (!trickId) {

      loading.textContent = "NO TRICK ID FOUND.";

      return;
    }

    const {
      data,
      error
    } = await client
      .from("tricks")
      .select("*")
      .eq("id", trickId)
      .eq("user_id", currentUser.id)
      .single();

    if (error) {

      console.error(error);

      loading.textContent = "COULD NOT LOAD THIS TRICK.";

      return;
    }

    currentTrick = data;

    trickName.textContent = currentTrick.name;

    trickNotes.textContent =
      currentTrick.notes || "No notes added yet.";

    await loadSessions();

    loading.style.display = "none";
    content.style.display = "block";

  }

  async function loadSessions() {

    const {
      data,
      error
    } = await client
      .from("sessions")
      .select(`
        id,
        confidence,
        notes,
        created_at,
        videos (
          id,
          storage_path,
          visibility,
          created_at
        )
      `)
      .eq("trick_id", currentTrick.id)
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.error(error);

      history.innerHTML =
        `<div class="empty">
          COULD NOT LOAD SESSION HISTORY.
        </div>`;

      return;
    }

    sessions = data || [];

    updateStats();

    await renderHistory();

  }

  function updateStats() {

    const count = sessions.length;

    sessionCount.textContent = count;

    historyCount.textContent =
      count === 1
        ? "1 SESSION"
        : `${count} SESSIONS`;

    if (count === 0) {

      startingConfidence.textContent = "—";
      currentConfidence.textContent = "—";
      bestConfidence.textContent = "—";
      confidenceValue.textContent = "—";
      confidenceBar.style.width = "0%";

      return;
    }

    /*
      Sessions are loaded newest first.

      The last item is therefore
      the user's earliest session.
    */

    const earliest =
      sessions[sessions.length - 1];

    const latest =
      sessions[0];

    const best =
      Math.max(
        ...sessions.map(
          session => Number(session.confidence)
        )
      );

    startingConfidence.textContent =
      earliest.confidence;

    currentConfidence.textContent =
      latest.confidence;

    bestConfidence.textContent =
      best;

    confidenceValue.textContent =
      `${latest.confidence}/5`;

    confidenceBar.style.width =
      `${(latest.confidence / 5) * 100}%`;

  }

  async function renderHistory() {

    if (sessions.length === 0) {

      history.innerHTML = `
        <div class="empty">
          NO SESSIONS YET.<br><br>
          LOG YOUR FIRST SESSION ABOVE.
        </div>
      `;

      return;
    }

    history.innerHTML = "";

    for (let index = 0; index < sessions.length; index++) {

      const session = sessions[index];

      const sessionElement =
        document.createElement("div");

      sessionElement.className = "session";

      const video =
        session.videos &&
        session.videos.length
          ? session.videos[0]
          : null;

      let videoHTML = "";

      if (video) {

        const {
          data,
          error
        } = await client.storage
          .from("videos")
          .createSignedUrl(
            video.storage_path,
            3600
          );

        if (!error && data?.signedUrl) {

          videoHTML = `
            <div class="video-tag">
              VIDEO // ${escapeHTML(video.visibility)}
            </div>

            <video
              controls
              preload="metadata"
              src="${escapeHTML(data.signedUrl)}"
            ></video>
          `;

        }

      }

      sessionElement.innerHTML = `

        <div class="session-top">

          <div>

            <div class="session-number">
              SESSION #${sessions.length - index}
            </div>

            <div class="session-date">
              ${formatDate(session.created_at)}
            </div>

          </div>

          <div class="session-confidence">
            CONFIDENCE ${session.confidence}/5
          </div>

        </div>

        ${
          session.notes
            ? `
              <div class="session-notes">
                ${escapeHTML(session.notes)}
              </div>
            `
            : ""
        }

        ${videoHTML}

      `;

      history.appendChild(sessionElement);

    }

  }

  sessionForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      submitBtn.disabled = true;

      showMessage(
        "SAVING SESSION...",
        "success"
      );

      try {

        const confidence =
          Number(
            document.querySelector(
              'input[name="confidence"]:checked'
            ).value
          );

        const notes =
          document.getElementById(
            "sessionNotes"
          ).value.trim();

        const videoFile =
          document.getElementById(
            "videoFile"
          ).files[0];

        const videoVisibility =
          document.getElementById(
            "videoVisibility"
          ).value;

        /*
          1. Create session
        */

        const {
          data: sessionData,
          error: sessionError
        } = await client
          .from("sessions")
          .insert({
            trick_id: currentTrick.id,
            user_id: currentUser.id,
            confidence,
            notes: notes || null
          })
          .select()
          .single();

        if (sessionError) {
          throw sessionError;
        }

        /*
          2. Upload video if selected
        */

        if (videoFile) {

          const originalName =
            videoFile.name || "clip";

          const safeName =
            originalName
              .replace(/[^a-zA-Z0-9._-]/g, "_")
              .slice(0, 120);

          const storagePath =
            `${currentUser.id}/${crypto.randomUUID()}-${safeName}`;

          const {
            error: uploadError
          } = await client.storage
            .from("videos")
            .upload(
              storagePath,
              videoFile,
              {
                contentType:
                  videoFile.type || "video/mp4",
                upsert: false
              }
            );

          if (uploadError) {

            await client
              .from("sessions")
              .delete()
              .eq("id", sessionData.id)
              .eq("user_id", currentUser.id);

            throw uploadError;
          }

          /*
            3. Connect video to session
          */

          const {
            error: videoError
          } = await client
            .from("videos")
            .insert({
              session_id: sessionData.id,
              user_id: currentUser.id,
              storage_path: storagePath,
              visibility: videoVisibility
            });

          if (videoError) {

            await client.storage
              .from("videos")
              .remove([
                storagePath
              ]);

            await client
              .from("sessions")
              .delete()
              .eq("id", sessionData.id)
              .eq("user_id", currentUser.id);

            throw videoError;
          }

        }

        /*
          4. Refresh trick history
        */

        sessionForm.reset();

        document.getElementById("c1").checked = true;

        showMessage(
          "SESSION LOGGED.",
          "success"
        );

        await loadSessions();

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Something went wrong.",
          "error"
        );

      } finally {

        submitBtn.disabled = false;

      }

    }
  );

  async function start() {

    if (!client) {

      loading.textContent =
        "SUPABASE IS NOT CONNECTED.";

      return;
    }

    const {
      data,
      error
    } = await client.auth.getSession();

    if (error || !data.session) {

      window.location.href = "auth.html";

      return;
    }

    currentUser =
      data.session.user;

    await loadTrick();

  }

  start();

</script>

</body>
</html>
