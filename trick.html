<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trick Archive — y2ksk8docu</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(180, 0, 0, .18), transparent 35%),
        #080808;
      color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid #292929;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #e00000;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .back {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .back:hover {
      color: #fff;
    }

    main {
      width: min(1000px, 90%);
      margin: 55px auto;
    }

    .eyebrow {
      color: #e00000;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 72px);
      line-height: .9;
      text-transform: uppercase;
      letter-spacing: -4px;
      margin-bottom: 18px;
    }

    .description {
      color: #999;
      max-width: 650px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .panel {
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .panel-title {
      font-size: 12px;
      color: #e00000;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #aaa;
      font-size: 12px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #080808;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      padding: 13px;
      outline: none;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #e00000;
    }

    input[type="file"] {
      padding: 10px;
    }

    .file-help {
      color: #666;
      font-size: 11px;
      line-height: 1.5;
    }

    .button {
      border: 0;
      background: #e00000;
      color: white;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 5px;
    }

    .button:hover {
      background: #ff1717;
    }

    .button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      font-size: 13px;
      color: #aaa;
      min-height: 20px;
    }

    .session {
      border-top: 1px solid #292929;
      padding: 25px 0;
    }

    .session:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .session-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }

    .session-date {
      color: #777;
      font-size: 12px;
    }

    .confidence {
      color: #e00000;
      font-weight: 900;
      font-size: 13px;
    }

    .session-notes {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    video {
      width: 100%;
      max-height: 550px;
      background: #000;
      border-radius: 12px;
      display: block;
    }

    .video-label {
      display: inline-block;
      margin-bottom: 10px;
      color: #777;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .empty {
      color: #666;
      line-height: 1.6;
    }

    .error {
      color: #ff4545;
    }

    .success {
      color: #5cff8d;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      h1 {
        letter-spacing: -2px;
      }

      main {
        margin-top: 35px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Y2KSK8DOCU</div>
  <a class="back" href="./dashboard.html">← BACK TO ARCHIVE</a>
</header>

<main>

  <div class="eyebrow">Trick archive</div>

  <h1 id="trickTitle">Loading...</h1>

  <p class="description" id="trickDescription">
    Loading trick information...
  </p>

  <section class="panel">

    <div class="panel-title">
      Log a new session
    </div>

    <form id="sessionForm">

      <div class="form-grid">

        <div class="field">
          <label for="confidence">CONFIDENCE</label>

          <select id="confidence" required>
            <option value="1">1 — Barely landed</option>
            <option value="2">2 — Getting there</option>
            <option value="3" selected>3 — Solid</option>
            <option value="4">4 — Consistent</option>
            <option value="5">5 — Automatic</option>
          </select>
        </div>

        <div class="field">
          <label for="visibility">VIDEO VISIBILITY</label>

          <select id="visibility">
            <option value="private">PRIVATE</option>
            <option value="public">PUBLIC</option>
          </select>
        </div>

        <div class="field full">
          <label for="notes">SESSION NOTES</label>

          <textarea
            id="notes"
            placeholder="What felt good? What needs work?"
          ></textarea>
        </div>

        <div class="field full">
          <label for="video">SKATE CLIP</label>

          <input
            id="video"
            type="file"
            accept="video/*"
          >

          <div class="file-help">
            Choose a video from your device. The clip will be stored
            privately in your Supabase storage unless you choose PUBLIC.
          </div>
        </div>

        <div class="field full">
          <button
            class="button"
            id="uploadButton"
            type="submit"
          >
            LOG SESSION + UPLOAD CLIP
          </button>

          <div class="status" id="status"></div>
        </div>

      </div>

    </form>

  </section>


  <section class="panel">

    <div class="panel-title">
      Progress history
    </div>

    <div id="sessions">
      <div class="empty">
        Loading sessions...
      </div>
    </div>

  </section>

</main>


<script>

  const client = window.supabaseClient;

  let currentUser = null;
  let trick = null;


  // --------------------------------------------
  // AUTH
  // --------------------------------------------

  async function checkAuth() {

    if (!client) {
      throw new Error("Supabase client is missing.");
    }

    const {
      data,
      error
    } = await client.auth.getSession();

    if (error) {
      throw error;
    }

    if (!data.session) {
      window.location.href = "./auth.html";
      return false;
    }

    currentUser = data.session.user;

    return true;
  }


  // --------------------------------------------
  // GET TRICK ID FROM URL
  // --------------------------------------------

  function getTrickId() {

    const params = new URLSearchParams(
      window.location.search
    );

    return params.get("id");
  }


  // --------------------------------------------
  // LOAD TRICK
  // --------------------------------------------

  async function loadTrick() {

    const trickId = getTrickId();

    if (!trickId) {
      throw new Error("No trick ID was provided.");
    }

    const {
      data,
      error
    } = await client
      .from("tricks")
      .select("*")
      .eq("id", trickId)
      .single();

    if (error) {
      throw error;
    }

    if (data.user_id !== currentUser.id) {
      throw new Error("You do not have permission to view this trick.");
    }

    trick = data;

    document.getElementById("trickTitle").textContent =
      trick.name;

    document.getElementById("trickDescription").textContent =
      trick.notes || "No notes added to this trick yet.";

    document.title =
      trick.name + " — y2ksk8docu";
  }


  // --------------------------------------------
  // UPLOAD SESSION
  // --------------------------------------------

  async function handleSessionSubmit(event) {

    event.preventDefault();

    const button =
      document.getElementById("uploadButton");

    const status =
      document.getElementById("status");

    const confidence =
      Number(
        document.getElementById("confidence").value
      );

    const notes =
      document.getElementById("notes").value.trim();

    const visibility =
      document.getElementById("visibility").value;

    const file =
      document.getElementById("video").files[0];


    button.disabled = true;

    status.className = "status";
    status.textContent = "Saving session...";


    let uploadedPath = null;


    try {

      // ----------------------------------------
      // CREATE SESSION
      // ----------------------------------------

      const {
        data: session,
        error: sessionError
      } = await client
        .from("sessions")
        .insert({
          trick_id: trick.id,
          user_id: currentUser.id,
          confidence: confidence,
          notes: notes || null
        })
        .select()
        .single();


      if (sessionError) {
        throw sessionError;
      }


      // ----------------------------------------
      // IF THERE IS NO VIDEO
      // ----------------------------------------

      if (!file) {

        status.className = "status success";

        status.textContent =
          "Session saved successfully.";

        document.getElementById("sessionForm").reset();

        document.getElementById("confidence").value = "3";

        await loadSessions();

        return;
      }


      // ----------------------------------------
      // CREATE SAFE FILE NAME
      // ----------------------------------------

      const originalName =
        file.name
          .replace(/[^a-zA-Z0-9._-]/g, "_");

      const storagePath =
        currentUser.id +
        "/" +
        crypto.randomUUID() +
        "-" +
        originalName;


      uploadedPath = storagePath;


      // ----------------------------------------
      // UPLOAD VIDEO
      // ----------------------------------------

      status.textContent =
        "Uploading clip...";


      const {
        error: uploadError
      } = await client
        .storage
        .from("videos")
        .upload(
          storagePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );


      if (uploadError) {
        throw uploadError;
      }


      // ----------------------------------------
      // SAVE VIDEO RECORD
      // ----------------------------------------

      status.textContent =
        "Finishing upload...";


      const {
        error: videoError
      } = await client
        .from("videos")
        .insert({
          session_id: session.id,
          user_id: currentUser.id,
          storage_path: storagePath,
          visibility: visibility
        });


      if (videoError) {
        throw videoError;
      }


      // ----------------------------------------
      // SUCCESS
      // ----------------------------------------

      status.className = "status success";

      status.textContent =
        "Session and clip saved successfully.";

      document.getElementById("sessionForm").reset();

      document.getElementById("confidence").value = "3";

      await loadSessions();


    } catch (error) {

      console.error(error);

      // If storage uploaded but DB insert failed,
      // remove the orphaned storage file.

      if (uploadedPath) {

        await client
          .storage
          .from("videos")
          .remove([uploadedPath]);
      }

      status.className = "status error";

      status.textContent =
        error.message ||
        "Something went wrong while saving your session.";


    } finally {

      button.disabled = false;

    }
  }


  // --------------------------------------------
  // LOAD SESSIONS
  // --------------------------------------------

  async function loadSessions() {

    const container =
      document.getElementById("sessions");


    const {
      data: sessions,
      error
    } = await client
      .from("sessions")
      .select(`
        id,
        confidence,
        notes,
        created_at,
        videos (
          id,
          storage_path,
          visibility,
          created_at
        )
      `)
      .eq("trick_id", trick.id)
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending: false
      });


    if (error) {
      console.error(error);

      container.innerHTML =
        '<div class="empty error">Could not load sessions.</div>';

      return;
    }


    if (!sessions || sessions.length === 0) {

      container.innerHTML = `
        <div class="empty">
          No sessions yet. Log your first session above.
        </div>
      `;

      return;
    }


    container.innerHTML = "";


    for (const session of sessions) {

      const element =
        document.createElement("div");

      element.className = "session";


      const date =
        new Date(session.created_at)
          .toLocaleString();


      const video =
        session.videos &&
        session.videos.length
          ? session.videos[0]
          : null;


      let videoHTML = "";


      if (video) {

        videoHTML = `
          <div style="margin-top:18px;">
            <div class="video-label">
              ${video.visibility.toUpperCase()} CLIP
            </div>

            <video
              id="video-${video.id}"
              controls
              preload="metadata"
            ></video>
          </div>
        `;
      }


      element.innerHTML = `

        <div class="session-head">

          <div>
            <strong>
              Session
            </strong>

            <div class="session-date">
              ${date}
            </div>
          </div>

          <div class="confidence">
            CONFIDENCE ${session.confidence}/5
          </div>

        </div>

        ${
          session.notes
            ? `<div class="session-notes">
                 ${escapeHTML(session.notes)}
               </div>`
            : ""
        }

        ${videoHTML}

      `;


      container.appendChild(element);


      // ----------------------------------------
      // CREATE SIGNED VIDEO URL
      // ----------------------------------------

      if (video) {

        const {
          data: signed,
          error: signedError
        } = await client
          .storage
          .from("videos")
          .createSignedUrl(
            video.storage_path,
            3600
          );


        if (!signedError && signed?.signedUrl) {

          const player =
            document.getElementById(
              "video-" + video.id
            );

          if (player) {
            player.src =
              signed.signedUrl;
          }

        }

      }

    }

  }


  // --------------------------------------------
  // HTML ESCAPING
  // --------------------------------------------

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  // --------------------------------------------
  // START
  // --------------------------------------------

  async function start() {

    try {

      const authenticated =
        await checkAuth();

      if (!authenticated) {
        return;
      }

      await loadTrick();

      await loadSessions();

    } catch (error) {

      console.error(error);

      document.getElementById("trickTitle").textContent =
        "ERROR";

      document.getElementById("trickDescription").textContent =
        error.message ||
        "Something went wrong.";

    }

  }


  document
    .getElementById("sessionForm")
    .addEventListener(
      "submit",
      handleSessionSubmit
    );


  start();

</script>

</body>
</html>
